---
# roles/precheck/tasks/pause_competing_services.yml
#
# SEGUNDA excepción a "precheck es de solo lectura" (la primera es la CA
# en repos_reachability.yml). Detiene aquí, UNA SOLA VEZ en PRECHECK, los
# agentes de seguridad corporativos configurados en
# zypper_lock_competing_services, para que ya estén libres cuando arranque
# "preparar repos" en vez de competir contra esa etapa.
#
# Nunca deshabilita ni desinstala estos agentes, solo los detiene
# temporalmente (reutiliza pause_security_agents.yml). Se reinician al
# terminar la migración real (resume_security_agents.yml).
#
# Si no se pudo detener alguno, se registra como FAILED explícito en vez
# de dejar que la excepción aborte el rol sin evidencia de los demás checks.

- name: "Pausar agentes de seguridad que interfieren con Zypper (si hay alguno activo)"
  block:
    - name: Pausar temporalmente agentes de seguridad y esperar a que se libere packagekitd
      ansible.builtin.include_role:
        name: repo_management
        tasks_from: pause_security_agents.yml

    - name: Registrar en el precheck qué agentes de seguridad se detuvieron (si alguno)
      ansible.builtin.set_fact:
        precheck_checks: "{{ precheck_checks + [{
            'name': 'agentes_seguridad_pausados',
            'status': 'OK',
            'detail': (
              ('Detenidos temporalmente y packagekitd verificado libre: ' ~ (security_agents_paused | join(', ')))
              if (security_agents_paused | default([])) | length > 0
              else 'Ninguno de los agentes configurados (zypper_lock_competing_services) estaba activo'
            )
          }] }}"
  rescue:
    - name: Registrar como FAILED si no se pudieron pausar los agentes de seguridad
      ansible.builtin.set_fact:
        precheck_checks: "{{ precheck_checks + [{
            'name': 'agentes_seguridad_pausados',
            'status': 'FAILED',
            'detail': 'No se pudieron detener uno o más agentes de seguridad configurados: ' ~ (ansible_failed_result.msg | default('error desconocido'))
          }] }}"

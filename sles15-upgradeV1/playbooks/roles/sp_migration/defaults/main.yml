---
# roles/sp_migration/defaults/main.yml

# Reintentos para la actualización de la pila de gestión de paquetes
# (zypper puede pedir que se vuelva a ejecutar tras actualizarse a sí
# mismo -- rc=103). También cubre el lock transitorio de PackageKit (rc=7,
# ver repo_management). 5 intentos / 5s, mismo presupuesto que
# zypper_lock_retries/_delay en group_vars/all.yml.
sp_migration_updatestack_retries: 5
sp_migration_updatestack_delay: 5

# Parámetros de reinicio tras una migración real aplicada.
#
# sp_migration_reboot_timeout: 20 min -- punto medio entre dar margen a
# servidores físicos (POST/firmware/RAID más lentos que una VM) y no
# esperar en silencio demasiado tiempo si algo nuevo cuelga el arranque.
sp_migration_reboot_timeout: 1200
sp_migration_reboot_connect_timeout: 30
sp_migration_reboot_pre_reboot_delay: 5

# Vars que debe suministrar quien incluye este rol (sin default de
# negocio):
#   main.yml        : sp_migration_current_sp, sp_migration_target_sp ("sp5"|"sp6"|"sp7"),
#                      sp_migration_releasever ("" | "15-SP7")
#   updatestack.yml : ninguna adicional (usa los repos Foreman de origen ya habilitados)
#
# No existe sp_migration_dry_run: un modo real (sp4_to_sp5/sp5_to_sp6/sp6_to_sp7/full)
# siempre ejecuta dup -D como gate obligatorio y, si pasa, el dup real.

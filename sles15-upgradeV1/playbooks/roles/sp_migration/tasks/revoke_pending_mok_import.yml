---
# roles/sp_migration/tasks/revoke_pending_mok_import.yml
#
# Evita un cuelgue real de arranque: al actualizar shim/grub2/kernel, sus
# scripts de instalación pueden dejar en cola una solicitud de inscripción
# de llave MOK (Machine Owner Key). En el siguiente arranque, shim
# intercepta con su pantalla de MokManager -- antes de GRUB/kernel, sin
# timeout, esperando una tecla en la consola física/del hipervisor.
# Invisible para SSH/journald/Ansible: se ve como un cuelgue sin rastro.
#
# Solo se actúa si Secure Boot está REALMENTE deshabilitado (ahí la llave
# pendiente no protege nada); si está habilitado, nunca se toca y queda
# registrado para que el operador la resuelva.
#
# Idempotente: si no hay ninguna solicitud pendiente, no hace nada.

- name: "Verificar si el binario mokutil existe en este host"
  # "command -v" es builtin de shell -- ansible.builtin.command ejecuta
  # sin shell y fallaría siempre buscando un binario "command" que no
  # existe, dejando esto en "skipping" sin aviso. shell sí lo interpreta.
  ansible.builtin.shell: command -v mokutil  # noqa command-instead-of-shell
  register: _mokutil_present
  changed_when: false
  failed_when: false

- name: "Bloque de MOK: solo si mokutil existe en este host"
  when: _mokutil_present.rc == 0
  block:
    - name: Consultar el estado de Secure Boot
      ansible.builtin.command: mokutil --sb-state
      register: _mok_sb_state
      become: true
      changed_when: false
      failed_when: false

    - name: Consultar si hay alguna solicitud de inscripción MOK pendiente
      ansible.builtin.command: mokutil --list-new
      register: _mok_list_new
      become: true
      changed_when: false
      failed_when: false

    - name: "Revocar la solicitud MOK pendiente (solo si Secure Boot está deshabilitado)"
      ansible.builtin.command: mokutil --revoke-import
      become: true
      when:
        - _mok_sb_state.stdout | default('') is search('disabled')
        - (_mok_list_new.stdout | default('')) | trim | length > 0
      register: _mok_revoke_result
      changed_when: _mok_revoke_result.rc == 0

    - name: "Advertir si hay una solicitud MOK pendiente CON Secure Boot habilitado (no se toca, requiere decisión del operador)"
      ansible.builtin.debug:
        msg: >-
          Hay una solicitud de inscripción MOK pendiente (mokutil
          --list-new) y Secure Boot está HABILITADO en este host. No se
          revoca automáticamente -- podría ser una llave legítima
          necesaria. El próximo reinicio mostrará la pantalla de
          MokManager en la consola física/del hipervisor, esperando
          confirmación manual antes de que el sistema pueda arrancar.
      when:
        - not (_mok_sb_state.stdout | default('') is search('disabled'))
        - (_mok_list_new.stdout | default('')) | trim | length > 0

    - name: "Registrar resultado de la verificación/revocación de MOK pendiente (para el reporte)"
      ansible.builtin.set_fact:
        mok_pending_import_result:
          secure_boot_state: "{{ 'disabled' if (_mok_sb_state.stdout | default('') is search('disabled')) else 'enabled_o_no_determinado' }}"
          habia_solicitud_pendiente: "{{ (_mok_list_new.stdout | default('')) | trim | length > 0 }}"
          se_revoco_automaticamente: "{{ (_mok_revoke_result.changed | default(false)) }}"

---
# roles/sp_migration/tasks/updatestack.yml
#
# Actualiza la pila de gestión de paquetes (zypper/rpm/libzypp) usando
# ÚNICAMENTE los repos Foreman/Katello del Service Pack de ORIGEN, ya
# agregados como temporales por repo_management/add_temp_repos.yml (alias
# "-src-"). En este punto los repos preexistentes ya fueron deshabilitados
# (disable_preexisting.yml): ningún repositorio del servidor, aparte de
# estos temporales Foreman, participa en este comando.
#
# Orden exigido por la guía oficial de SUSE ("Upgrading with plain
# Zypper", paso 2: "Update the package management tools with the OLD
# SUSE Linux Enterprise repositories") y por el flujo acordado del
# proyecto.

- name: Actualizar la pila de gestión de paquetes con los repositorios del SP de origen
  ansible.builtin.command:
    cmd: zypper --non-interactive patch --updatestack-only
  become: true
  register: _updatestack_result
  until: _updatestack_result.rc == 0
  retries: "{{ sp_migration_updatestack_retries }}"
  delay: "{{ sp_migration_updatestack_delay }}"
  changed_when: "'Nothing to do' not in (_updatestack_result.stdout | default(''))"
  # failed_when: false -- captura el resultado completo antes de fallar,
  # para no perder el stdout/stderr real de Zypper (mismo principio que
  # el gate dup -D).
  failed_when: false

- name: "Registrar la salida completa de updatestack (éxito o fallo, para el reporte)"
  ansible.builtin.set_fact:
    sp_migration_updatestack_output: >-
      {{ ((_updatestack_result.stdout | default('')) ~ '\n' ~ (_updatestack_result.stderr | default(''))) | trim | truncate(20000) }}

- name: "Diagnosticar qué bloquea a Zypper (diagnóstico de solo lectura)"
  ansible.builtin.include_role:
    name: repo_management
    tasks_from: diagnosticar_packagekit.yml
  when: _updatestack_result.rc != 0

- name: "Fallar explícitamente, con el detalle real de Zypper, si updatestack no fue exitoso"
  ansible.builtin.fail:
    msg: >-
      zypper patch --updatestack-only no fue exitoso tras
      {{ sp_migration_updatestack_retries }} reintentos (rc={{ _updatestack_result.rc }}):
      {{ sp_migration_updatestack_output }}


      Diagnóstico de qué bloquea a Zypper en este momento:
      {{ packagekit_diagnostico | default('N/D') }}
  when: _updatestack_result.rc != 0

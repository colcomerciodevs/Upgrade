---
# roles/sp_migration/tasks/main.yml
#
# Ejecuta la migración real de Service Pack, ya con los repos Foreman de
# destino habilitados (ver playbooks/tasks/run_stage.yml). Basado en el
# procedimiento "plain Zypper" documentado por SUSE (adaptado a
# repositorios Foreman/Katello, decisión de arquitectura de este proyecto
# — ver README.md).
#
# SP5 -> SP6 no usa --releasever (así lo documenta la guía SLES 15 SP6).
# SP6 -> SP7 sí usa --releasever=15-SP7 (así lo documenta la guía SLES 15 SP7).
# Quien incluye este rol decide sp_migration_releasever según la etapa.
#
# NOTAS IMPORTANTES:
# - El paso "zypper patch --updatestack-only" NO está aquí: se ejecuta
#   ANTES, con los repos Foreman de ORIGEN (ver updatestack.yml).
# - La confirmación confirm_production_upgrade YA se validó en
#   run_stage.yml, ANTES de tocar cualquier repositorio. Este archivo no
#   vuelve a preguntarlo: si se llegó aquí, ya está autorizado.
# - No existe un modo "solo dry-run" en este archivo: dup -D se ejecuta
#   SIEMPRE como gate obligatorio inmediatamente antes del dup real. Para
#   un ensayo que se pueda pedir de forma independiente sin llegar a este
#   punto, use upgrade_mode: validate (roles/sp_migration/tasks/preflight.yml).
# - El reinicio es SIEMPRE obligatorio tras un dup real aplicado.
#
# MODELO DE ESTADOS (no se pierde evidencia si el reinicio falla):
#   sp_migration_dup_applied      -> true inmediatamente después del dup real exitoso.
#   sp_migration_reboot_completed -> true solo si el reinicio realmente terminó.
#   sp_migration_reconnected      -> true solo si Ansible reconectó tras el reinicio.
# Estas tres son independientes entre sí. Un reinicio fallido NUNCA borra
# la evidencia de que el dup sí se aplicó: el bloque de reinicio captura su
# propio fallo con rescue, sin afectar los hechos ya establecidos.
# `stage_validated` (calculado en playbooks/tasks/run_stage.yml) es la
# única bandera que además exige reconexión, SP confirmado, servicios
# críticos y GeoPOS crítico OK.

- name: "Conservar evidencia: habilitar journald persistente antes de la migración real"
  ansible.builtin.include_tasks: ensure_journald_persistent.yml
  when: journald_enable_persistent | default(true)

- name: Ejecutar dup -D como gate obligatorio inmediatamente antes del dup real
  # "failed_when: false" aquí es deliberado: si se deja que esta tarea falle
  # por sí sola (rc != 0), Ansible aborta ANTES de llegar a la tarea
  # siguiente, que es la que guarda la salida real de Zypper en un hecho —
  # la evidencia de qué paquete/dependencia causó el problema se perdería
  # por completo, dejando al operador solo un mensaje genérico en el
  # reporte. Por eso se registra el resultado completo primero, y la
  # decisión de fallar se hace explícita en la tarea siguiente, después de
  # haber guardado la salida.
  ansible.builtin.command:
    cmd: >-
      zypper --non-interactive
      {{ '--releasever=' ~ sp_migration_releasever if (sp_migration_releasever | default('')) | length > 0 else '' }}
      dup -D --no-allow-vendor-change --no-recommends
  become: true
  register: sp_migration_dry_run_result
  # "until": mismo reintento por lock transitorio de PackageKit (rc=7,
  # ZYPP_LOCKED) que repo_management -- confirmado con evidencia real en
  # laboratorio (2026-10-06) que el lock puede aparecer en cualquier
  # comando Zypper del host, no solo en los de repo_management. Cualquier
  # otro código de error (conflictos reales de dependencias/vendor) se
  # deja pasar de inmediato, sin agotar reintentos.
  until: (sp_migration_dry_run_result.rc | default(1)) != 7
  retries: "{{ zypper_lock_retries }}"
  delay: "{{ zypper_lock_delay }}"
  changed_when: false
  failed_when: false

- name: "Registrar salida completa del gate dup -D (éxito o fallo)"
  ansible.builtin.set_fact:
    sp_migration_dry_run_output: >-
      {{ ((sp_migration_dry_run_result.stdout | default('')) ~ '\n' ~ (sp_migration_dry_run_result.stderr | default(''))) | trim | truncate(20000) }}

- name: "Diagnosticar qué bloquea a Zypper, si dup -D encontró problemas (diagnóstico de solo lectura)"
  ansible.builtin.include_role:
    name: repo_management
    tasks_from: diagnosticar_packagekit.yml
  when: sp_migration_dry_run_result.rc != 0

- name: "Fallar explícitamente si dup -D encontró problemas (la salida completa queda en el reporte)"
  ansible.builtin.fail:
    msg: >-
      zypper dup -D (simulación obligatoria antes del dup real) encontró
      problemas (rc={{ sp_migration_dry_run_result.rc }}). La salida completa
      de Zypper queda en el reporte de esta etapa, sección "Resultado de la
      migración" / "Gate obligatorio dup -D" -- normalmente indica paquetes
      con conflictos de dependencias o cambios de proveedor (vendor).
      Corríjalos (o, si corresponde, documente y autorice la excepción) antes
      de reintentar esta etapa. No se ejecutó ningún cambio real.


      Diagnóstico de qué bloquea a Zypper en este momento:
      {{ packagekit_diagnostico | default('N/D') }}
  when: sp_migration_dry_run_result.rc != 0

- name: Ejecutar la migración real (zypper dup)
  ansible.builtin.command:
    cmd: >-
      zypper --non-interactive
      {{ '--releasever=' ~ sp_migration_releasever if (sp_migration_releasever | default('')) | length > 0 else '' }}
      dup --no-allow-vendor-change --no-recommends
  become: true
  register: sp_migration_dup_result
  # "until": mismo reintento por lock transitorio de PackageKit (rc=7) que
  # el gate dup -D de arriba. El dup real ya pasó el gate exitosamente, así
  # que un rc=7 aquí es casi con certeza el mismo lock transitorio, no un
  # problema real recién aparecido.
  until: (sp_migration_dup_result.rc | default(1)) != 7
  retries: "{{ zypper_lock_retries }}"
  delay: "{{ zypper_lock_delay }}"
  changed_when: true
  # "failed_when: false" aquí es deliberado (igual que el gate dup -D de
  # arriba): captura el resultado completo ANTES de decidir fallar, para
  # no perder el stdout/stderr real de Zypper con el genérico "non-zero
  # return code" de Ansible.
  failed_when: false

- name: Registrar salida resumida de la migración real
  ansible.builtin.set_fact:
    sp_migration_dup_output: "{{ sp_migration_dup_result.stdout | default('') | truncate(20000) }}"

- name: "Diagnosticar qué bloquea a Zypper, si el dup real falló (diagnóstico de solo lectura)"
  ansible.builtin.include_role:
    name: repo_management
    tasks_from: diagnosticar_packagekit.yml
  when: sp_migration_dup_result.rc != 0

- name: "Fallar explícitamente, con el detalle real de Zypper, si el dup real no fue exitoso"
  ansible.builtin.fail:
    msg: >-
      zypper dup (migración real) no fue exitoso (rc={{ sp_migration_dup_result.rc }}):
      {{ sp_migration_dup_output }}


      Diagnóstico de qué bloquea a Zypper en este momento:
      {{ packagekit_diagnostico | default('N/D') }}
  when: sp_migration_dup_result.rc != 0

- name: Marcar el dup como aplicado INMEDIATAMENTE (no depende del resultado del reinicio)
  ansible.builtin.set_fact:
    sp_migration_dup_applied: true

- name: Verificar paquetes huérfanos/no necesarios tras la migración (informativo)
  ansible.builtin.command:
    cmd: zypper --non-interactive packages --orphaned --unneeded
  register: sp_migration_orphaned_packages
  become: true
  changed_when: false
  failed_when: false

- name: "Deshabilitar permanentemente servicios que pueden colgar el arranque (si hay alguno configurado), antes del reinicio obligatorio"
  # Decisión explícita del usuario para este ambiente (2026-10-07): ver
  # playbooks/group_vars/all.yml (reboot_disable_services) para la
  # evidencia real que lo justifica -- confirmado que postfix puede
  # colgar INDEFINIDAMENTE el arranque tras un upgrade de Service Pack.
  ansible.builtin.include_role:
    name: repo_management
    tasks_from: disable_boot_blocking_services.yml

- name: "Trazabilidad del reinicio: leer boot_id y hora de inicio ANTES de reiniciar"
  # boot_id (/proc/sys/kernel/random/boot_id) es un UUID que el kernel
  # genera de nuevo en cada arranque -- comparar el de antes/después es
  # la única forma de confirmar que el host realmente reinició (y no, por
  # ejemplo, que Ansible reconectó a la misma sesión tras una caída breve
  # de red sin que el kernel haya cambiado). No requiere become: el
  # archivo es de lectura pública.
  block:
    - name: Leer boot_id actual (antes del reinicio)
      ansible.builtin.slurp:
        src: /proc/sys/kernel/random/boot_id
      register: _boot_id_before_raw

    - name: Registrar boot_id "antes" y hora de inicio del reinicio
      ansible.builtin.set_fact:
        sp_migration_reboot_boot_id_before: "{{ (_boot_id_before_raw.content | b64decode) | trim }}"
        sp_migration_reboot_started_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

- name: Reiniciar el sistema y esperar reconexión (fallo capturado localmente; el dup ya quedó registrado)
  block:
    - name: Reiniciar el sistema tras la migración real (obligatorio, sin excepción)
      ansible.builtin.reboot:
        reboot_timeout: "{{ sp_migration_reboot_timeout }}"
        connect_timeout: "{{ sp_migration_reboot_connect_timeout }}"
        pre_reboot_delay: "{{ sp_migration_reboot_pre_reboot_delay }}"
        msg: "Reinicio controlado por ansible-sles-upgrade ({{ sp_migration_current_sp }} -> {{ sp_migration_target_sp }})"
      become: true
      register: sp_migration_reboot_result

    - name: "Trazabilidad del reinicio: leer boot_id DESPUÉS de reconectar y calcular duraciones"
      block:
        - name: Leer boot_id actual (después de reconectar)
          ansible.builtin.slurp:
            src: /proc/sys/kernel/random/boot_id
          register: _boot_id_after_raw

        - name: Registrar boot_id "después" y comparar con el de antes
          ansible.builtin.set_fact:
            sp_migration_reboot_boot_id_after: "{{ (_boot_id_after_raw.content | b64decode) | trim }}"
            sp_migration_reboot_finished_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

        - name: Calcular si el boot_id realmente cambió y el tiempo de reconexión real
          ansible.builtin.set_fact:
            sp_migration_reboot_boot_id_changed: "{{ sp_migration_reboot_boot_id_after != sp_migration_reboot_boot_id_before }}"
            # "duración devuelta por Ansible": tiempo que el propio módulo
            # reboot reporta haber esperado (incluye pre_reboot_delay +
            # espera de reconexión). "tiempo de reconexión": cálculo
            # independiente por reloj de pared (started_at vs
            # finished_at, ambos capturados por esta misma automatización)
            # -- mismo principio de doble evidencia que la verificación de
            # Service Pack (sección 7 del README): si ambos números
            # difieren mucho, es una señal real de algo raro durante el
            # arranque, no solo un detalle de instrumentación.
            sp_migration_reboot_elapsed_ansible_seconds: "{{ sp_migration_reboot_result.elapsed | default('NOT_CHECKED') }}"
            sp_migration_reboot_reconnect_seconds: >-
              {{
                (
                  (sp_migration_reboot_finished_at | to_datetime(format='%Y-%m-%dT%H:%M:%SZ'))
                  - (sp_migration_reboot_started_at | to_datetime(format='%Y-%m-%dT%H:%M:%SZ'))
                ).total_seconds() | int
              }}

    - name: Marcar reinicio y reconexión como completados
      ansible.builtin.set_fact:
        sp_migration_reboot_completed: true
        sp_migration_reconnected: true
  rescue:
    - name: "Registrar que el reinicio o la reconexión fallaron (el dup sigue registrado como aplicado; se conserva boot_id 'antes' para diagnóstico)"
      ansible.builtin.set_fact:
        sp_migration_reboot_completed: false
        sp_migration_reconnected: false
        sp_migration_reboot_boot_id_after: "NOT_CHECKED: el host no reconectó tras el reinicio"
        sp_migration_reboot_boot_id_changed: "NOT_CHECKED"
        sp_migration_reboot_finished_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
        sp_migration_reboot_elapsed_ansible_seconds: "NOT_CHECKED"
        sp_migration_reboot_reconnect_seconds: "NOT_CHECKED"

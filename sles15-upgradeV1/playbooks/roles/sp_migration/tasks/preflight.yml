---
# roles/sp_migration/tasks/preflight.yml
#
# Preflight REAL de la migración contra los repositorios Foreman/Katello,
# usando la opción global de Zypper `--reposd-dir <dir>` ("Use alternative
# repository definition file directory") para aislar POR COMPLETO la
# operación de /etc/zypp/repos.d: se construye un directorio temporal que
# contiene ÚNICAMENTE los repos Foreman de la fase correspondiente, y
# Zypper se ejecuta apuntando exclusivamente a ese directorio.
#
# IMPORTANTE — alcance de `--reposd-dir`: aísla los ARCHIVOS .repo (dónde
# busca Zypper definiciones de repositorio). No se afirma ni se asume que
# aísle también servicios de Zypper (`services.d`) u otros componentes; por
# eso este archivo nunca usa `refresh -s`/`--services` (ver más abajo) y
# refresca siempre alias explícitos, nunca "todo lo configurado".
#
# Decisión técnica: se evaluó `--disable-repositories` + `--plus-repo`,
# pero `--disable-repositories` está documentada únicamente como "Do not
# read meta-data from repositories" — no hay evidencia documental
# suficiente de que garantice usar EXCLUSIVAMENTE los repos indicados por
# --plus-repo. `--reposd-dir` es inequívoca para archivos .repo.
#
# Dos verificaciones independientes, cada una en su propio directorio
# aislado (para que un `dup -D` nunca vea repos de la otra fase):
#   - ORIGEN (opcional): solo un refresh no destructivo, para confirmar que
#     los repos Foreman del Service Pack de origen son accesibles.
#   - DESTINO (obligatoria si hay repos configurados): refresh + dup -D,
#     el chequeo real de solver/metadata/GPG/TLS contra el Service Pack
#     objetivo.
#
# Siempre limpia AMBOS directorios temporales al finalizar (éxito o
# fallo): no debe quedar ninguna configuración temporal en el host.
#
# Vars requeridas: sp_migration_target_sp, sp_migration_releasever,
#                   sp_migration_repositories (destino; lista de {name, url})
# Vars opcionales: sp_migration_origin_sp, sp_migration_origin_repositories
#                   (si se omiten u origin_repositories queda vacía, el
#                   chequeo de origen se reporta NOT_CHECKED, sin bloquear)

- name: Verificar si este Zypper soporta --reposd-dir
  ansible.builtin.command:
    cmd: zypper --help
  register: _zypper_help
  changed_when: false
  failed_when: false

- name: Calcular si el preflight real es soportado en este host
  ansible.builtin.set_fact:
    sp_migration_preflight_supported: "{{ '--reposd-dir' in (_zypper_help.stdout | default('')) }}"

- name: Registrar que el preflight real no es soportado por esta versión de Zypper
  ansible.builtin.set_fact:
    sp_migration_preflight_result:
      status: NOT_CHECKED
      supported: false
      origin: {checked: false, status: NOT_CHECKED, output_summary: "no evaluado: --reposd-dir no soportado"}
      output_summary: >-
        Este Zypper no expone --reposd-dir (verificado con `zypper --help`); no fue
        posible ejecutar aquí el preflight real de forma aislada. Revisar manualmente
        la versión de Zypper del host y la documentación oficial de SUSE para esa
        versión antes de considerar VALIDATE completado.
  when: not sp_migration_preflight_supported

- name: "Ejecutar preflight real aislado con --reposd-dir"
  when: sp_migration_preflight_supported
  block:
    - name: Asegurar que la CA interna esté instalada antes de usar repos Foreman reales (VALIDATE)
      # Este archivo SÍ conserva su propia llamada (a diferencia de
      # add_temp_repos.yml): upgrade_mode: validate NO pasa por
      # roles/precheck/tasks/repos_reachability.yml (que ahora es el lugar
      # donde PRECHECK asegura la CA) -- validate solo incluye sp_version.yml/
      # repo_inventory.yml/critical_services.yml antes de llegar aquí. Sin
      # esta llamada, un VALIDATE independiente en un host que nunca corrió
      # PRECHECK antes fallaría por falta de confianza TLS.
      ansible.builtin.include_role:
        name: repo_management
        tasks_from: ensure_ca_trusted.yml

    - name: Registrar chequeo de origen NOT_CHECKED (no solicitado o sin repos configurados)
      ansible.builtin.set_fact:
        _preflight_origin_result:
          checked: false
          status: NOT_CHECKED
          output_summary: "no se solicitó verificación de origen, o katello.<sp>_repositories de origen está vacío"
      when: (sp_migration_origin_repositories | default([])) | length == 0

    - name: "Verificar acceso a los repos Foreman de ORIGEN (refresh no destructivo, aislado)"
      when: (sp_migration_origin_repositories | default([])) | length > 0
      block:
        - name: Calcular directorio temporal aislado para el chequeo de origen
          ansible.builtin.set_fact:
            _preflight_origin_dir: "/var/tmp/ansible-sles-upgrade-validate-origin-{{ sp_migration_origin_sp | default('sp') }}-{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

        - name: Crear directorio temporal aislado para origen
          ansible.builtin.file:
            path: "{{ _preflight_origin_dir }}"
            state: directory
            mode: "0700"
          become: true

        - name: Calcular alias de los repos Foreman de origen a usar en el preflight
          ansible.builtin.set_fact:
            _preflight_origin_aliases: |-
              {% set result = [] %}
              {% for idx in range(0, sp_migration_origin_repositories | length) %}
              {% set _ = result.append('validate-origin-' ~ (sp_migration_origin_sp | default('sp')) ~ '-' ~ '%02d' | format(idx + 1)) %}
              {% endfor %}
              {{ result }}

        - name: Agregar los repos Foreman de ORIGEN únicamente en el directorio aislado
          # "--no-gpgcheck": decisión explícita del usuario para este ambiente
          # (CLAUDE.md, "Verificación GPG de repositorios Foreman", 2026-10-06),
          # flag oficial de Zypper por-repositorio, nunca el global "--no-gpg-checks".
          # Debe ir ANTES de "-n" (que consume el siguiente token como su
          # valor); confirmado con evidencia real en laboratorio (2026-10-06).
          ansible.builtin.command:
            argv: ['zypper', '--reposd-dir', "{{ _preflight_origin_dir }}", '--non-interactive', 'addrepo', '-f', '--no-gpgcheck', '-n', "{{ item.name }}", "{{ item.url }}", "{{ _preflight_origin_aliases[idx] }}"]
          loop: "{{ sp_migration_origin_repositories }}"
          loop_control:
            index_var: idx
            label: "{{ item.name }}"
          become: true
          register: _preflight_origin_addrepo
          # "until": mismo reintento por lock transitorio de PackageKit
          # (rc=7, ZYPP_LOCKED) que repo_management -- el lock es del
          # propio libzypp del host, no de este directorio aislado, así
          # que puede aparecer aquí igual que en UPGRADE real. Confirmado
          # con evidencia real en laboratorio (2026-10-06).
          until: (_preflight_origin_addrepo.rc | default(1)) != 7
          retries: "{{ repo_management_zypper_lock_retries }}"
          delay: "{{ repo_management_zypper_lock_delay }}"
          changed_when: false
          failed_when: false

        - name: "Refrescar ÚNICAMENTE los alias de origen (sin -s/--services)"
          ansible.builtin.command:
            argv: "{{ ['zypper', '--reposd-dir', _preflight_origin_dir, '--non-interactive', 'refresh', '-f'] + _preflight_origin_aliases }}"
          become: true
          register: _preflight_origin_refresh
          until: (_preflight_origin_refresh.rc | default(1)) != 7
          retries: "{{ repo_management_zypper_lock_retries }}"
          delay: "{{ repo_management_zypper_lock_delay }}"
          changed_when: false
          failed_when: false

        - name: Registrar resultado del chequeo de origen
          ansible.builtin.set_fact:
            _preflight_origin_result:
              checked: true
              status: >-
                {{
                  'OK' if (
                    (_preflight_origin_addrepo.results | map(attribute='rc') | select('ne', 0) | list | length == 0)
                    and _preflight_origin_refresh.rc == 0
                  ) else 'FAILED'
                }}
              reposd_dir_used: "{{ _preflight_origin_dir }}"
              output_summary: >-
                {{ (
                  '--- addrepo (origen) ---\n' ~ (_preflight_origin_addrepo.results | map(attribute='stdout') | join('\n')) ~ (_preflight_origin_addrepo.results | map(attribute='stderr') | join('\n')) ~
                  '\n--- refresh (origen) ---\n' ~ (_preflight_origin_refresh.stdout | default('')) ~ (_preflight_origin_refresh.stderr | default(''))
                ) | trim | truncate(20000) }}
      always:
        - name: Eliminar el directorio temporal aislado de origen (siempre, éxito o fallo)
          ansible.builtin.file:
            path: "{{ _preflight_origin_dir }}"
            state: absent
          become: true
          when: _preflight_origin_dir is defined

    - name: Calcular directorio temporal aislado para el preflight de destino
      ansible.builtin.set_fact:
        _preflight_reposd_dir: "/var/tmp/ansible-sles-upgrade-validate-{{ sp_migration_target_sp }}-{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

    - name: "Verificar destino y ejecutar dup -D real, aislado, hacia {{ sp_migration_target_sp }}"
      block:
        - name: Crear directorio temporal aislado (vacío, sin relación con /etc/zypp/repos.d)
          ansible.builtin.file:
            path: "{{ _preflight_reposd_dir }}"
            state: directory
            mode: "0700"
          become: true

        - name: Calcular alias de los repos Foreman de destino a usar en el preflight
          ansible.builtin.set_fact:
            _preflight_aliases: |-
              {% set result = [] %}
              {% for idx in range(0, sp_migration_repositories | length) %}
              {% set _ = result.append('validate-' ~ sp_migration_target_sp ~ '-' ~ '%02d' | format(idx + 1)) %}
              {% endfor %}
              {{ result }}

        - name: Agregar los repos Foreman de destino únicamente en el directorio aislado
          # "--no-gpgcheck": misma decisión explícita del usuario (ver arriba,
          # y CLAUDE.md "Verificación GPG de repositorios Foreman", 2026-10-06).
          # Debe ir ANTES de "-n" (que consume el siguiente token como su
          # valor); confirmado con evidencia real en laboratorio (2026-10-06).
          ansible.builtin.command:
            argv: ['zypper', '--reposd-dir', "{{ _preflight_reposd_dir }}", '--non-interactive', 'addrepo', '-f', '--no-gpgcheck', '-n', "{{ item.name }}", "{{ item.url }}", "{{ _preflight_aliases[idx] }}"]
          loop: "{{ sp_migration_repositories }}"
          loop_control:
            index_var: idx
            label: "{{ item.name }}"
          become: true
          register: _preflight_addrepo
          until: (_preflight_addrepo.rc | default(1)) != 7
          retries: "{{ repo_management_zypper_lock_retries }}"
          delay: "{{ repo_management_zypper_lock_delay }}"
          changed_when: false
          failed_when: false

        - name: "Refrescar ÚNICAMENTE los alias de destino (sin -s/--services, con --releasever si aplica)"
          ansible.builtin.command:
            argv: >-
              {{
                ['zypper', '--reposd-dir', _preflight_reposd_dir, '--non-interactive']
                + (['--releasever=' ~ sp_migration_releasever] if (sp_migration_releasever | default('')) | length > 0 else [])
                + ['refresh', '-f']
                + _preflight_aliases
              }}
          become: true
          register: _preflight_refresh
          until: (_preflight_refresh.rc | default(1)) != 7
          retries: "{{ repo_management_zypper_lock_retries }}"
          delay: "{{ repo_management_zypper_lock_delay }}"
          changed_when: false
          failed_when: false

        - name: Ejecutar dup -D (solver real) usando exclusivamente el directorio aislado de destino
          ansible.builtin.command:
            argv: >-
              {{
                ['zypper', '--reposd-dir', _preflight_reposd_dir, '--non-interactive']
                + (['--releasever=' ~ sp_migration_releasever] if (sp_migration_releasever | default('')) | length > 0 else [])
                + ['dup', '-D', '--no-allow-vendor-change', '--no-recommends']
              }}
          become: true
          register: _preflight_dup
          until: (_preflight_dup.rc | default(1)) != 7
          retries: "{{ repo_management_zypper_lock_retries }}"
          delay: "{{ repo_management_zypper_lock_delay }}"
          changed_when: false
          failed_when: false

        - name: Registrar resultado del preflight de destino
          ansible.builtin.set_fact:
            _preflight_destination_result:
              status: >-
                {{
                  'OK' if (
                    (_preflight_addrepo.results | map(attribute='rc') | select('ne', 0) | list | length == 0)
                    and _preflight_refresh.rc == 0
                    and _preflight_dup.rc == 0
                  ) else 'FAILED'
                }}
              reposd_dir_used: "{{ _preflight_reposd_dir }}"
              return_code: "{{ _preflight_dup.rc }}"
              output_summary: >-
                {{ (
                  '--- addrepo (destino) ---\n' ~ (_preflight_addrepo.results | map(attribute='stdout') | join('\n')) ~ (_preflight_addrepo.results | map(attribute='stderr') | join('\n')) ~
                  '\n--- refresh (destino) ---\n' ~ (_preflight_refresh.stdout | default('')) ~ (_preflight_refresh.stderr | default('')) ~
                  '\n--- dup -D (destino) ---\n' ~ (_preflight_dup.stdout | default('')) ~ (_preflight_dup.stderr | default(''))
                ) | trim | truncate(20000) }}
      always:
        - name: Eliminar el directorio temporal aislado de destino (siempre, éxito o fallo)
          ansible.builtin.file:
            path: "{{ _preflight_reposd_dir }}"
            state: absent
          become: true
          when: _preflight_reposd_dir is defined

    - name: Consolidar resultado final del preflight (origen + destino, orden FAILED > NOT_CHECKED > OK)
      # VALIDATE solo puede quedar OK cuando origen Y destino están, ambos,
      # en OK. Un origen NOT_CHECKED (por ejemplo, sin repos Foreman de
      # origen configurados) NUNCA debe producir un resultado global OK,
      # aunque el destino haya salido perfecto: eso ocultaría que falta
      # verificar la mitad del procedimiento real (updatestack).
      ansible.builtin.set_fact:
        sp_migration_preflight_result:
          status: >-
            {{
              'FAILED' if (_preflight_origin_result.status == 'FAILED' or _preflight_destination_result.status == 'FAILED')
              else ('NOT_CHECKED' if _preflight_origin_result.status == 'NOT_CHECKED'
              else 'OK')
            }}
          supported: true
          origin: "{{ _preflight_origin_result }}"
          reposd_dir_used: "{{ _preflight_destination_result.reposd_dir_used }}"
          return_code: "{{ _preflight_destination_result.return_code }}"
          output_summary: "{{ _preflight_destination_result.output_summary }}"

---
# roles/repo_management/tasks/add_temp_repos.yml
#
# Agrega repositorios Foreman/Katello temporales para UNA fase de la
# migración (origen -> updatestack, o destino -> dup) y refresca metadata.
# Se llama dos veces por etapa con vars distintas; acumula en la lista
# `repos_temporary_created` (debe inicializarse en [] al comenzar la etapa).
#
# Vars requeridas:
#   repo_management_phase_sp           : "sp5"|"sp6"|"sp7" (SP que representan estos repos)
#   repo_management_alias_suffix       : "src" (origen/updatestack) | "dst" (destino/dup)
#   repo_management_phase_repositories : lista [{name, url}, ...] de katello.*
#   repo_management_phase_releasever   : "" | "15-SP7" (solo aplica al refresh de esta fase)
#
# NOTA: ya NO instala aquí la CA interna (antes lo hacía). Se movió a
# roles/precheck/tasks/repos_reachability.yml, que SIEMPRE corre antes que
# este archivo dentro de la misma ejecución (ver playbooks/tasks/
# run_stage.yml: "Ejecutar precheck de la etapa" es el primer paso real,
# antes de "Preparar repos y migrar"). Para el camino de VALIDATE, que NO
# pasa por repos_reachability.yml, la CA se sigue asegurando por su cuenta
# en roles/sp_migration/tasks/preflight.yml.

- name: "Validar que hay repositorios Foreman/Katello configurados para la fase {{ repo_management_alias_suffix }}"
  ansible.builtin.assert:
    that:
      - (repo_management_phase_repositories | default([])) | length > 0
    fail_msg: >-
      No hay repositorios definidos en katello.{{ repo_management_phase_sp }}_repositories.
      Complete este dato real (CHANGE_ME) antes de ejecutar una migración real.
    success_msg: "Repositorios Foreman/Katello definidos para {{ repo_management_phase_sp }} ({{ repo_management_alias_suffix }}): {{ repo_management_phase_repositories | length }}"

- name: "Calcular el prefijo de alias de esta fase (para detectar huérfanos de una ejecución anterior fallida)"
  ansible.builtin.set_fact:
    _phase_alias_prefix: "{{ temporary_repo_prefix }}{{ repo_management_phase_sp }}-{{ repo_management_alias_suffix }}-"

- name: "Retirar, si quedaron, repos huérfanos con este mismo prefijo de una ejecución anterior fallida"
  # Confirmado con evidencia real en laboratorio (2026-10-06): si una
  # ejecución previa falló DESPUÉS de agregar estos alias (por ejemplo, en
  # el refresh posterior) pero ANTES de llegar a su propio cleanup.yml, los
  # alias quedan existentes en el host. Al reintentar la etapa, "addrepo"
  # fallaría de inmediato con "already exists" para los 10/10 alias. Esto
  # es seguro de ejecutar siempre (incluso si no hay huérfanos, no hace
  # nada): solo retira alias que coincidan EXACTAMENTE con el prefijo
  # identificable de ESTA fase de esta automatización (nunca repositorios
  # preexistentes del cliente ni de otra fase/etapa).
  ansible.builtin.include_role:
    name: repo_management
    tasks_from: cleanup.yml
  vars:
    repo_management_cleanup_prefix: "{{ _phase_alias_prefix }}"

- name: "Registrar los huérfanos retirados por separado del cleanup normal de la etapa"
  # Evita que el mismo alias aparezca dos veces en "Temporales Foreman
  # retirados" del reporte (una vez aquí, por huérfano, y otra vez al
  # retirarse normalmente más adelante en esta misma etapa).
  ansible.builtin.set_fact:
    repos_leftover_removed_before_start: "{{ repos_leftover_removed_before_start + repos_temporary_removed }}"
    repos_temporary_removed: []
  when: repos_temporary_removed | length > 0

- name: Calcular alias de los repositorios temporales de esta fase
  ansible.builtin.set_fact:
    _phase_temp_aliases: |-
      {% set result = [] %}
      {% for idx in range(0, repo_management_phase_repositories | length) %}
      {% set _ = result.append(temporary_repo_prefix ~ repo_management_phase_sp ~ '-' ~ repo_management_alias_suffix ~ '-' ~ '%02d' | format(idx + 1)) %}
      {% endfor %}
      {{ result }}

- name: "Agregar repositorios temporales Foreman/Katello ({{ repo_management_alias_suffix }})"
  # EVIDENCIA PARCIAL: si el repo N falla, los repos 1..N-1 ya agregados
  # deben quedar registrados en repos_temporary_created de todos modos. El
  # loop nunca aborta a mitad de camino (failed_when: false); el fallo se
  # reporta explícitamente DESPUÉS de consolidar la evidencia real.
  #
  # "until" reintenta SOLO si Zypper devuelve rc=7 (ZYPP_LOCKED -- libzypp
  # bloqueado, típicamente por PackageKit u otra herramienta de gestión de
  # paquetes corriendo en ese momento; confirmado con evidencia real en
  # laboratorio). Cualquier otro código de error se deja pasar de
  # inmediato (sin agotar los reintentos) para que el fallo real se
  # reporte sin demora innecesaria.
  #
  # "--no-gpgcheck": decisión explícita del usuario para este ambiente
  # (ver CLAUDE.md, "Verificación GPG de repositorios Foreman", 2026-10-06)
  # -- flag OFICIAL de Zypper, POR REPOSITORIO (zypper help addrepo), nunca
  # el flag global "--no-gpg-checks". Solo afecta a este alias temporal que
  # esta automatización está creando ahora mismo; nunca toca la
  # configuración GPG de ningún repositorio preexistente del cliente.
  # IMPORTANTE: debe ir ANTES de "-n" -- "-n" consume el siguiente token
  # como su valor (el nombre descriptivo), así que colocarlo entre "-n" y
  # el nombre real hace que zypper use "--no-gpgcheck" como nombre y deje
  # un argumento posicional de más ("Too many arguments"); confirmado con
  # evidencia real en laboratorio (2026-10-06).
  ansible.builtin.command:
    cmd: >-
      zypper --non-interactive addrepo -f --no-gpgcheck -n "{{ item.name }}"
      "{{ item.url }}"
      "{{ _phase_temp_aliases[idx] }}"
  loop: "{{ repo_management_phase_repositories }}"
  loop_control:
    index_var: idx
    label: "{{ item.name }}"
  become: true
  register: _addrepo_result
  until: (_addrepo_result.rc | default(1)) != 7
  retries: "{{ repo_management_zypper_lock_retries }}"
  delay: "{{ repo_management_zypper_lock_delay }}"
  changed_when: true
  failed_when: false

- name: Registrar los alias EFECTIVAMENTE creados y los que fallaron en esta fase (según rc real)
  ansible.builtin.set_fact:
    _phase_created_aliases: |-
      {% set result = [] %}
      {% for pair in _phase_temp_aliases | zip(_addrepo_result.results) %}
      {% if pair[1].rc | default(1) == 0 %}{% set _ = result.append(pair[0]) %}{% endif %}
      {% endfor %}
      {{ result }}
    _phase_failed_aliases: |-
      {% set result = [] %}
      {% for pair in _phase_temp_aliases | zip(_addrepo_result.results) %}
      {% if pair[1].rc | default(1) != 0 %}{% set _ = result.append(pair[0]) %}{% endif %}
      {% endfor %}
      {{ result }}

- name: Registrar en el acumulado de la etapa los alias temporales que SÍ se crearon
  ansible.builtin.set_fact:
    repos_temporary_created: "{{ repos_temporary_created + _phase_created_aliases }}"

- name: "Calcular el detalle real (stdout/stderr de Zypper) de los repositorios que no se pudieron agregar"
  # Mismo principio que ya se aplicó al gate dup -D: decir SOLO "cuáles"
  # fallaron, sin la salida real de Zypper, no es suficiente para
  # diagnosticar (ej. "ya existe un repositorio con ese alias" vs. un
  # problema de red/URL) sin tener que ir a leer el log crudo del Job.
  ansible.builtin.set_fact:
    _phase_failed_details: |-
      {% set result = [] %}
      {% for pair in _phase_temp_aliases | zip(_addrepo_result.results) %}
      {% if pair[1].rc | default(1) != 0 %}
      {% set _ = result.append(pair[0] ~ ': ' ~ ((pair[1].stdout | default('')) ~ ' ' ~ (pair[1].stderr | default(''))) | trim) %}
      {% endif %}
      {% endfor %}
      {{ result }}
  when: _phase_failed_aliases | length > 0

- name: "Fallar explícitamente si algún repositorio temporal no pudo agregarse en esta fase {{ repo_management_alias_suffix }}"
  ansible.builtin.fail:
    msg: >-
      No se pudieron agregar los siguientes repositorios temporales:
      {{ _phase_failed_details | join(' | ') }}. Los que sí se agregaron
      correctamente antes del fallo quedaron registrados:
      {{ _phase_created_aliases | join(', ') or 'ninguno' }}.
  when: _phase_failed_aliases | length > 0

- name: "Refrescar ÚNICAMENTE los alias temporales Foreman de esta fase (con --releasever si aplica)"
  # Explícitamente SIN "-s"/"--services": este proyecto no usa servicios de
  # Zypper para descubrir repositorios, y "-s" refresca TODOS los servicios
  # del sistema (pudiendo introducir repos ajenos al conjunto controlado).
  # Se listan los alias exactos recién creados para que el refresh no
  # alcance a ningún otro repositorio (ni siquiera otros ya deshabilitados).
  ansible.builtin.command:
    argv: >-
      {{
        ['zypper', '--non-interactive']
        + (['--releasever=' ~ repo_management_phase_releasever] if (repo_management_phase_releasever | default('')) | length > 0 else [])
        + ['refresh', '-f']
        + _phase_created_aliases
      }}
  become: true
  register: repo_refresh_result
  changed_when: true
  # Captura explícita en lugar de dejar que Ansible falle con el genérico
  # "non-zero return code": ese mensaje, sin stdout/stderr real de Zypper,
  # no permite diagnosticar sin leer el log crudo del Job (mismo principio
  # ya aplicado a addrepo más arriba y a disable_preexisting.yml/cleanup.yml).
  failed_when: false

- name: "Fallar explícitamente, con el detalle real de Zypper, si falló el refresh de la fase {{ repo_management_alias_suffix }}"
  ansible.builtin.fail:
    msg: >-
      No se pudo refrescar la metadata de los repositorios temporales
      {{ _phase_created_aliases | join(', ') }} (rc={{ repo_refresh_result.rc }}):
      {{ ((repo_refresh_result.stdout | default('')) ~ ' ' ~ (repo_refresh_result.stderr | default(''))) | trim | truncate(4000) }}
  when: repo_refresh_result.rc | default(1) != 0

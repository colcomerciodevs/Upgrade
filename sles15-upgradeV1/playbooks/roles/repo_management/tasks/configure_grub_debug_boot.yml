---
# roles/repo_management/tasks/configure_grub_debug_boot.yml
#
# Arranque de depuración opcional, controlado por grub_debug_boot_enabled
# (group_vars/all.yml; false por defecto) para diagnosticar un cuelgue de
# reinicio sin rastro en journald.
#
# Habilitado: GRUB_TERMINAL pasa a "console" (sin tema gráfico) y se
# agrega systemd.log_level=debug + systemd.show_status=1 +
# plymouth.enable=0 al cmdline, quitando splash/quiet -- para ver en la
# consola del hipervisor qué unidad de systemd se inicia/detiene durante
# el arranque y el apagado. plymouth.enable=0 es un seguro adicional:
# quitar splash/quiet no garantiza que plymouth no tome la consola igual.
#
# Mecanismo: un bloque (blockinfile) al FINAL de /etc/default/grub, sin
# tocar las líneas originales -- como el archivo se interpreta como
# shell, la última asignación de cada variable gana. En false (default)
# el bloque no existe y el host queda con su GRUB original.
#
# Conserva los demás parámetros del cmdline real del host (mitigations,
# security=apparmor, crashkernel, etc.), no los hardcodea.
#
# Idempotente en ambos sentidos. Solo aplica si /etc/default/grub existe.

- name: Verificar si existe /etc/default/grub en este host
  ansible.builtin.stat:
    path: /etc/default/grub
  register: _grub_default_file

- name: "Bloque de arranque de depuración de GRUB, solo si /etc/default/grub existe"
  when: _grub_default_file.stat.exists
  block:
    - name: "Leer la línea ORIGINAL de GRUB_CMDLINE_LINUX_DEFAULT (la primera del archivo, nunca una que este bloque hubiera agregado antes)"
      ansible.builtin.shell: set -o pipefail && grep -m1 '^GRUB_CMDLINE_LINUX_DEFAULT=' /etc/default/grub | cut -d'"' -f2  # noqa command-instead-of-shell
      args:
        executable: /bin/bash
      register: _grub_cmdline_original
      changed_when: false
      failed_when: false

    - name: "Calcular el cmdline de depuración (igual al original, sin splash/quiet, con los parámetros de depuración)"
      ansible.builtin.set_fact:
        _grub_debug_cmdline: >-
          {{
            (
              (_grub_cmdline_original.stdout | default(''))
              | regex_replace('(^|\s)splash(=\S+)?(\s|$)', ' ')
              | regex_replace('(^|\s)quiet(\s|$)', ' ')
              | trim
            ) ~ ' systemd.log_level=debug systemd.show_status=1 plymouth.enable=0'
          }}

    - name: "Gestionar el bloque de arranque de depuración al final de /etc/default/grub"
      ansible.builtin.blockinfile:
        path: /etc/default/grub
        marker: "# {mark} ANSIBLE MANAGED BLOCK -- arranque de depuración (ansible-sles-upgrade, ver README sección 8.7)"
        block: |
          GRUB_TERMINAL="console"
          GRUB_CMDLINE_LINUX_DEFAULT="{{ _grub_debug_cmdline }}"
        state: "{{ 'present' if (grub_debug_boot_enabled | default(false)) else 'absent' }}"
      become: true
      register: _grub_debug_block_result

    - name: "Regenerar grub.cfg (siempre -- idempotente y barato, evita condicionar un comando a .changed de la tarea anterior)"
      ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg
      become: true
      changed_when: false
      when: _grub_debug_block_result.changed | default(false)  # noqa no-handler

    - name: "Registrar el estado del arranque de depuración en esta corrida (para el reporte)"
      ansible.builtin.set_fact:
        grub_debug_boot_result:
          habilitado: "{{ grub_debug_boot_enabled | default(false) }}"
          se_aplico_ahora: "{{ _grub_debug_block_result.changed | default(false) }}"

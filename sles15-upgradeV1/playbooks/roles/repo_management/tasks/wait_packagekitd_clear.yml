---
# roles/repo_management/tasks/wait_packagekitd_clear.yml
#
# Espera (de solo lectura, vía "pgrep") a que no quede ningún proceso
# "packagekitd" en ejecución. Si sigue activo al agotar la espera, no
# falla: confía en que el "until"/"retries" de cada comando de Zypper
# absorba el resto.
#
# Detener ds_agent/nessusagent (pause_security_agents.yml, en PRECHECK) no
# mata una transacción de PackageKit ya en curso -- packagekitd es
# activado por D-Bus, no es hijo del agente. Por eso esta espera (más
# liviana, nunca vuelve a detener nada) se repite antes de cada etapa que
# vaya a modificar repositorios/paquetes.
#
# Deja wait_packagekitd_note con un resumen legible para el reporte.

- name: Verificar/esperar a que no quede ningún packagekitd en ejecución
  ansible.builtin.command:
    cmd: pgrep -x packagekitd
  register: _packagekitd_still_running
  until: _packagekitd_still_running.rc != 0
  retries: "{{ zypper_lock_retries }}"
  delay: "{{ zypper_lock_delay }}"
  become: true
  changed_when: false
  failed_when: false

- name: Registrar nota legible sobre el resultado de la espera de packagekitd
  ansible.builtin.set_fact:
    wait_packagekitd_note: >-
      {{
        'packagekitd no estaba corriendo' if _packagekitd_still_running.attempts | default(1) == 1 and _packagekitd_still_running.rc != 0
        else ('packagekitd se liberó tras esperar' if _packagekitd_still_running.rc != 0
        else 'packagekitd seguía activo tras agotar la espera; se continuó (los reintentos de cada comando de Zypper son el respaldo)')
      }}

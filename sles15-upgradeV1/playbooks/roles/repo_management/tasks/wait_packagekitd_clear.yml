---
# roles/repo_management/tasks/wait_packagekitd_clear.yml
#
# Espera (de solo lectura, vía "pgrep") a que no quede ningún proceso
# "packagekitd" en ejecución, hasta zypper_lock_retries intentos con
# zypper_lock_delay segundos entre cada uno. Si sigue activo al agotar la
# espera, NO falla: continúa igual, confiando en que el "until"/"retries"
# de cada comando real de Zypper (ver zypper_lock_retries/_delay en
# playbooks/group_vars/all.yml) absorba el resto.
#
# Confirmado con evidencia real en laboratorio (2026-10-07, job AWX #9257):
# detener ds_agent/nessusagent (ver pause_security_agents.yml, llamado una
# sola vez en PRECHECK) no mata una transacción de PackageKit que ya
# estaba en curso en ese instante -- packagekitd es activado por D-Bus, no
# es un proceso hijo del agente, así que sigue corriendo por su cuenta
# hasta terminar. Por eso esta espera se repite aquí (más liviana: solo
# "pgrep", nunca vuelve a detener nada) justo antes de que cada etapa
# (preparar/aplicar) empiece a modificar repositorios/paquetes.
#
# Deja wait_packagekitd_note con un resumen legible para el reporte.

- name: Verificar/esperar a que no quede ningún packagekitd en ejecución
  ansible.builtin.command:
    cmd: pgrep -x packagekitd
  register: _packagekitd_still_running
  until: _packagekitd_still_running.rc != 0
  retries: "{{ zypper_lock_retries }}"
  delay: "{{ zypper_lock_delay }}"
  become: true
  changed_when: false
  failed_when: false

- name: Registrar nota legible sobre el resultado de la espera de packagekitd
  ansible.builtin.set_fact:
    wait_packagekitd_note: >-
      {{
        'packagekitd no estaba corriendo' if _packagekitd_still_running.attempts | default(1) == 1 and _packagekitd_still_running.rc != 0
        else ('packagekitd se liberó tras esperar' if _packagekitd_still_running.rc != 0
        else 'packagekitd seguía activo tras agotar la espera; se continuó (los reintentos de cada comando de Zypper son el respaldo)')
      }}

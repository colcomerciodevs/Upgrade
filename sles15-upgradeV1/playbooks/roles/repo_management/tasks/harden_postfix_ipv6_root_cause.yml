---
# roles/repo_management/tasks/harden_postfix_ipv6_root_cause.yml
#
# Corrección de la CAUSA RAÍZ real de postfix (ver README sección 8.5).
# Decisión explícita del usuario para este ambiente (2026-10-09, aplicable
# a todos los hosts): en vez de deshabilitar postfix permanentemente
# (política anterior, 2026-10-07 a 2026-10-09), se corrige directamente
# su configuración y se confía en eso -- postfix queda habilitado/activo
# como cualquier otro servicio del host.
#
# Causa raíz confirmada: con `inet_interfaces = localhost` en main.cf,
# postfix intenta resolver `::1` (IPv6) en un host sin IPv6 configurado.
# Con el sistema ya arrancado y estable, ese mismo error falla en menos de
# 1 segundo; durante el arranque, antes de que la red esté completamente
# lista, la misma resolución se cuelga en vez de fallar rápido -- ese es
# el cuelgue real que se confirmó en laboratorio (host sles15-sp5-sp7,
# 2026-10-08).
#
# Fix 1 -- oficial documentado por Postfix para hosts sin IPv6:
# `inet_protocols = ipv4` -- evita por completo que postfix intente
# resolver direcciones IPv6, sin importar qué diga `inet_interfaces`.
# Validado con evidencia real (2026-10-08/09): con el fix puesto,
# `systemctl start/restart postfix` arranca en menos de 1 segundo,
# `active (running)`, sin ningún problema.
#
# Fix 2 -- defensa adicional contra la ventana de carrera real detrás del
# cuelgue (2026-10-09): `postfix.service` en este proyecto depende de
# `network.target` (confirmado vía `systemctl show`), que solo garantiza
# que las interfaces están "configuradas", NO que la red ya tiene
# conectividad real/DNS funcionando -- esa ventana, durante el arranque,
# es donde una resolución (IPv6 u otra causa futura no identificada)
# puede demorar o colgarse. Un *drop-in* de systemd agrega
# `After=network-online.target` + `Wants=network-online.target` (espera
# a que la red esté realmente lista antes de intentar arrancar) y un
# `TimeoutStartSec` explícito y corto (systemd ya limita por defecto a
# 90s, pero fijarlo explícito a 30s es más estricto y documentado, en vez
# de depender de un default que podría cambiar).
#
# Si algo de lo anterior cambió, se reinicia el servicio de inmediato para
# que tome el fix ya mismo -- importante porque el propio `dup` puede
# haber reinstalado el paquete de postfix y reseteado main.cf a sus
# valores por defecto (con IPv6 de nuevo), dejando una instancia corriendo
# con la configuración rota hasta el próximo restart/reinicio si no se
# hace aquí. Idempotente: si no hubo cambios, no reinicia nada. Solo
# aplica si postfix está instalado en este host.

- name: Verificar si existe la configuración de postfix en este host
  ansible.builtin.stat:
    path: /etc/postfix/main.cf
  register: _postfix_main_cf

- name: "Corregir causa raíz de postfix (inet_protocols = ipv4, evita el cuelgue por resolución IPv6) si está instalado"
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: '^#?\s*inet_protocols\s*='
    line: 'inet_protocols = ipv4'
    insertafter: EOF
  become: true
  register: _postfix_ipv6_fix_result
  when: _postfix_main_cf.stat.exists

- name: "Crear el directorio de drop-in de systemd para postfix.service, si está instalado"
  ansible.builtin.file:
    path: /etc/systemd/system/postfix.service.d
    state: directory
    mode: "0755"
  become: true
  when: _postfix_main_cf.stat.exists

- name: "Agregar drop-in: esperar red realmente lista y limitar el tiempo de arranque, si está instalado"
  ansible.builtin.copy:
    dest: /etc/systemd/system/postfix.service.d/boot-safety.conf
    content: |
      # Agregado por ansible-sles-upgrade (ver README sección 8.5).
      # Espera a que la red tenga conectividad real (no solo interfaces
      # configuradas) antes de intentar arrancar, y limita explícitamente
      # el tiempo de arranque -- defensa adicional contra un cuelgue de
      # resolución durante el arranque, más allá del fix de
      # inet_protocols = ipv4 en main.cf.
      [Unit]
      After=network-online.target
      Wants=network-online.target

      [Service]
      TimeoutStartSec=30
    mode: "0644"
  become: true
  register: _postfix_dropin_result
  when: _postfix_main_cf.stat.exists

- name: "Recargar systemd si el drop-in cambió"
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when:
    - _postfix_main_cf.stat.exists
    - _postfix_dropin_result.changed | default(false)

- name: "Reiniciar postfix para que tome los fixes de inmediato (solo si algo cambió)"
  ansible.builtin.systemd:
    name: postfix
    state: restarted
  become: true
  when:
    - _postfix_main_cf.stat.exists
    - (_postfix_ipv6_fix_result.changed | default(false)) or (_postfix_dropin_result.changed | default(false))

- name: "Registrar si se corrigió la causa raíz de postfix en esta corrida (para el reporte)"
  ansible.builtin.set_fact:
    postfix_ipv6_root_cause_fixed: "{{ (_postfix_ipv6_fix_result.changed | default(false)) or (_postfix_dropin_result.changed | default(false)) }}"
  when: _postfix_main_cf.stat.exists

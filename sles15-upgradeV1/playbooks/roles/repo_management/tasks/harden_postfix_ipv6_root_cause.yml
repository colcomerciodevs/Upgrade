---
# roles/repo_management/tasks/harden_postfix_ipv6_root_cause.yml
#
# Manejo completo de postfix antes de cualquier reinicio obligatorio (ver
# README sección 8.4). Causa raíz: `inet_interfaces = localhost` en
# main.cf hace que postfix intente resolver IPv6 durante el arranque, y se
# cuelga en vez de fallar rápido si el host no tiene IPv6. Defensa en
# profundidad: corrige main.cf (`inet_protocols = ipv4`) Y además
# deshabilita, detiene y fuerza la terminación de cualquier proceso que
# quede colgado -- no se confía solo en el fix de configuración.
#
# No se modifica la unidad de systemd de postfix (ni con un drop-in,
# descartado): queda exactamente como viene del paquete, gestionada solo
# vía systemctl + kill.
#
# Idempotente: no falla si postfix no está instalado, si ya estaba
# deshabilitado/detenido, o si no quedaba ningún proceso por terminar.

- name: Verificar si existe la configuración de postfix en este host
  ansible.builtin.stat:
    path: /etc/postfix/main.cf
  register: _postfix_main_cf

- name: "Corregir causa raíz de postfix (inet_protocols = ipv4, defensa en profundidad) si está instalado"
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: '^#?\s*inet_protocols\s*='
    line: 'inet_protocols = ipv4'
    insertafter: EOF
  become: true
  register: _postfix_ipv6_fix_result
  when: _postfix_main_cf.stat.exists

- name: "Quitar cualquier drop-in de systemd para postfix.service que haya quedado de una corrida anterior"
  # Converge cualquier host que haya quedado con el drop-in ya descartado
  # de vuelta a la unidad original de postfix, sin importar el historial.
  ansible.builtin.file:
    path: /etc/systemd/system/postfix.service.d
    state: absent
  become: true
  register: _postfix_dropin_removed
  when: _postfix_main_cf.stat.exists

- name: "Recargar systemd si se quitó el drop-in"
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when:
    - _postfix_main_cf.stat.exists
    - _postfix_dropin_removed.changed | default(false)

- name: "Deshabilitar y detener postfix (ya no se confía solo en la corrección de configuración)"
  ansible.builtin.systemd:
    name: postfix
    enabled: false
    state: stopped
  become: true
  when: _postfix_main_cf.stat.exists

- name: "Forzar la terminación de los procesos principales de postfix (master, pickup, qmgr)"
  # Respaldo final por si "systemctl stop" no bastara. "master" es un
  # nombre de proceso genérico -- podría en teoría coincidir con otro
  # proceso no relacionado en este host.
  ansible.builtin.command: killall -9 master pickup qmgr
  become: true
  changed_when: false
  failed_when: false
  when: _postfix_main_cf.stat.exists

- name: "Barrido final: terminar CUALQUIER proceso de postfix por ruta de su binario (smtpd, cleanup, trivial-rewrite, bounce, anvil, proxymap, tlsmgr, local, smtp, etc.)"
  # "master" recién eliminado con -9 puede dejar huérfanos a sus procesos
  # hijo activos. "pkill -f" empareja por la ruta del binario
  # (/usr/lib/postfix/), así que atrapa a todos sin listar cada nombre.
  ansible.builtin.command: pkill -9 -f /usr/lib/postfix
  become: true
  changed_when: false
  failed_when: false
  when: _postfix_main_cf.stat.exists

- name: "Verificar que no quedó ningún proceso de postfix corriendo (para el reporte)"
  ansible.builtin.command: pgrep -af /usr/lib/postfix
  become: true
  register: _postfix_leftover_processes
  changed_when: false
  failed_when: false
  when: _postfix_main_cf.stat.exists

- name: "Registrar si se corrigió la causa raíz de postfix en esta corrida (para el reporte)"
  ansible.builtin.set_fact:
    postfix_ipv6_root_cause_fixed: "{{ _postfix_ipv6_fix_result.changed | default(false) }}"
    postfix_disabled_and_killed: true
    postfix_leftover_processes: "{{ _postfix_leftover_processes.stdout | default('') | trim }}"
  when: _postfix_main_cf.stat.exists

---
# roles/repo_management/defaults/main.yml

# Directorio base (en el host administrado) donde se respalda
# /etc/zypp/repos.d antes de modificar repositorios. Se le agrega un
# timestamp y el nombre de la etapa en cada ejecución.
repo_management_backup_base_dir: /var/backup/ansible-sles-upgrade

# Vars que debe suministrar quien incluye este rol (sin valor por defecto
# de negocio, para forzar que se declaren explícitamente por etapa/fase):
#   backup.yml              : repo_management_target_sp
#   add_temp_repos.yml      : repo_management_phase_sp, repo_management_alias_suffix,
#                             repo_management_phase_repositories, repo_management_phase_releasever
#   cleanup.yml             : repo_management_cleanup_prefix
#
# repos_temporary_created y repos_temporary_removed deben inicializarse en
# [] al comenzar cada etapa (ver playbooks/tasks/run_stage.yml).

# Reintentos para cualquier comando de Zypper de este rol (addrepo,
# modifyrepo --disable, removerepo) que falle con rc=7
# (ZYPPER_EXIT_ZYPP_LOCKED: "libzypp is locked, e.g. packagekit is
# running" -- confirmado contra el código fuente oficial de zypper,
# https://github.com/openSUSE/zypper/blob/master/src/main.h). Es un lock
# TRANSITORIO (PackageKit u otra herramienta de gestión de paquetes
# soltándolo normalmente en segundos) -- confirmado con evidencia real en
# laboratorio el 2026-10-06, donde un addrepo individual falló así una vez
# y, al reintentar la corrida completa, pasó sin problema.
repo_management_zypper_lock_retries: 5
repo_management_zypper_lock_delay: 5

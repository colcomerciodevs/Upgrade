---
# roles/reporting/tasks/main.yml
#
# Genera el reporte HTML (+ JSON) por host y por etapa a partir de
# `stage_report`, y registra una línea de resumen en run_summary.jsonl
# para poder construir después el resumen consolidado.
#
# Los reportes se escriben primero en el nodo de control (delegate_to:
# localhost) bajo report_local_dir. ESTO NO ES ALMACENAMIENTO PERSISTENTE:
# el filesystem de un Execution Environment de AWX puede ser efímero
# incluso para "localhost" y desecharse al terminar el Job. Es solo el
# área de trabajo mientras corre el playbook.
#
# Si report_destination ya no es el valor CHANGE_ME por defecto, además
# se copian allí HTML y JSON (mecanismo simple, pensado para extenderse
# cuando se defina el destino corporativo real). Mientras
# report_destination siga siendo CHANGE_ME, los reportes NO quedan
# garantizados fuera de esta ejecución.

- name: Calcular timestamp del reporte
  ansible.builtin.set_fact:
    _report_timestamp: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

- name: Calcular carpeta de etapa legible (acción + fase, cuando la fase no es "both")
  # "both" (todo en una sola corrida, el comportamiento de siempre) no se
  # agrega al nombre para no generar una carpeta "sp6_both" cuando no hay
  # ninguna fase real que distinguir -- ver playbooks/group_vars/all.yml
  # para los valores posibles de upgrade_phase.
  ansible.builtin.set_fact:
    _report_stage_folder: >-
      {{
        stage_report.action
        if (stage_report.phase | default('both')) in ['both', '']
        else (stage_report.action ~ '_' ~ stage_report.phase)
      }}

- name: Calcular carpeta RFC/CRQ segura para el nombre de directorio (sin espacios ni caracteres especiales)
  ansible.builtin.set_fact:
    _report_crq_folder: "{{ (stage_report.crq | default('') | trim | length > 0) | ternary(stage_report.crq | trim | regex_replace('[^A-Za-z0-9_-]', '_'), 'SIN_CRQ') }}"

- name: Calcular ruta base del reporte de esta etapa (RFC/CRQ -> hostname -> etapa)
  ansible.builtin.set_fact:
    _report_stage_dir: "{{ report_local_dir }}/{{ _report_crq_folder }}/{{ inventory_hostname }}/{{ _report_stage_folder }}"

- name: Asegurar el directorio local del reporte (RFC/CRQ -> hostname -> etapa)
  ansible.builtin.file:
    path: "{{ _report_stage_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false

- name: Renderizar reporte HTML de la etapa
  ansible.builtin.template:
    src: report.html.j2
    dest: "{{ _report_stage_dir }}/{{ _report_stage_folder }}_{{ _report_timestamp }}.html"
    mode: "0644"
  delegate_to: localhost
  become: false

- name: Guardar reporte en formato JSON (para el resumen consolidado y auditoría)
  ansible.builtin.copy:
    content: "{{ stage_report | to_nice_json }}"
    dest: "{{ _report_stage_dir }}/{{ _report_stage_folder }}_{{ _report_timestamp }}.json"
    mode: "0644"
  delegate_to: localhost
  become: false

- name: "Calcular la línea de historial de esta etapa (para el consolidado por Lote)"
  # Incluye crq/lote/ambiente/phase explícitamente: el consolidado
  # (playbooks/report_consolidado.yml) filtra por estos campos y agrupa
  # por host+fase -- sin ellos no podría saber a qué Lote/CRQ pertenece
  # cada línea ni distinguir "preparar" de "aplicar" para el mismo stage.
  ansible.builtin.set_fact:
    _run_summary_entry:
      hostname: "{{ inventory_hostname }}"
      crq: "{{ stage_report.crq | default('') }}"
      lote: "{{ stage_report.lote | default('') }}"
      ambiente: "{{ stage_report.ambiente | default('') }}"
      stage: "{{ stage_report.stage }}"
      action: "{{ stage_report.action }}"
      phase: "{{ stage_report.phase | default('') }}"
      status: "{{ stage_report.status }}"
      timestamp: "{{ _report_timestamp }}"
      report_html: "{{ _report_stage_dir ~ '/' ~ _report_stage_folder ~ '_' ~ _report_timestamp ~ '.html' }}"

- name: "Registrar línea de historial en run_summary.jsonl (área de trabajo local de esta ejecución)"
  ansible.builtin.lineinfile:
    path: "{{ report_local_dir }}/run_summary.jsonl"
    line: "{{ _run_summary_entry | to_json }}"
    create: true
    insertafter: EOF
    mode: "0644"
  delegate_to: localhost
  become: false

- name: "Registrar la misma línea en el destino persistente (sobrevive entre nodos separados del Workflow)"
  # CRÍTICO para el consolidado: en el Workflow de 5 etapas, cada nodo
  # (Precheck/Preparar/Aplicar) es un Job de AWX separado, normalmente en
  # su propio Execution Environment -- report_local_dir NO sobrevive entre
  # esos nodos (ver advertencia en playbooks/group_vars/all.yml). Sin esta
  # copia, el consolidado generado en un nodo posterior nunca vería lo que
  # registraron los nodos anteriores, y mostraría estados incompletos o
  # desactualizados (ej. una etapa "Aplicar" que falló, pero el consolidado
  # seguiría mostrando solo el último estado que SÍ pudo leer -- "OK" de
  # una etapa anterior -- en vez del fallo real).
  ansible.builtin.lineinfile:
    path: "{{ report_destination }}/run_summary.jsonl"
    line: "{{ _run_summary_entry | to_json }}"
    create: true
    insertafter: EOF
    mode: "0644"
  delegate_to: localhost
  become: false
  when: not (report_destination is search('CHANGE_ME'))
  failed_when: false

- name: Asegurar el subdirectorio RFC/CRQ -> hostname -> etapa en el destino persistente, si ya está configurado
  # "copy" (tarea siguiente) no crea directorios padre inexistentes -- a
  # diferencia de antes (un solo archivo plano directamente en
  # report_destination), ahora hace falta crear este árbol de carpetas
  # explícitamente. Tolerante a fallo (igual que la copia): si
  # report_destination no existe o no tiene permisos, esto no detiene la
  # ejecución -- la copia de abajo fallará igual y quedará advertida.
  ansible.builtin.file:
    path: "{{ report_destination }}/{{ _report_crq_folder }}/{{ inventory_hostname }}/{{ _report_stage_folder }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  when: not (report_destination is search('CHANGE_ME'))
  failed_when: false

- name: Copiar el reporte HTML y JSON al destino persistente definitivo, si ya está configurado
  # Mismo árbol RFC/CRQ -> hostname -> etapa que en report_local_dir (ver
  # arriba), para que report_destination quede organizado igual.
  ansible.builtin.copy:
    src: "{{ _report_stage_dir }}/{{ _report_stage_folder }}_{{ _report_timestamp }}.{{ item }}"
    dest: "{{ report_destination }}/{{ _report_crq_folder }}/{{ inventory_hostname }}/{{ _report_stage_folder }}/{{ _report_stage_folder }}_{{ _report_timestamp }}.{{ item }}"
    remote_src: true
    mode: "0644"
  loop: ["html", "json"]
  delegate_to: localhost
  become: false
  register: _report_destination_copy
  when: not (report_destination is search('CHANGE_ME'))
  failed_when: false

- name: Advertir si la copia hacia report_destination falló
  ansible.builtin.debug:
    msg: >-
      ADVERTENCIA: no se pudo copiar el reporte ({{ item.item }}) a
      report_destination ({{ report_destination }}). El reporte local en
      {{ report_local_dir }}/{{ inventory_hostname }}/ sigue disponible.
      Detalle: {{ item.msg | default('error desconocido') }}
  loop: "{{ _report_destination_copy.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  when:
    - not (report_destination is search('CHANGE_ME'))
    - item is failed

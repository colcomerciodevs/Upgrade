---
# playbooks/group_vars/all.yml
#
# Variables comunes a todos los hosts. Los valores marcados como CHANGE_ME
# son datos reales del ambiente que todavía no han sido provistos por el
# administrador. NO deben sustituirse con datos inventados.
#
# UBICACIÓN DELIBERADA: este archivo vive junto al playbook
# (playbooks/upgrade.yml), NO junto al inventario. Ansible carga
# group_vars/host_vars tanto desde el directorio del inventario en uso
# como desde el directorio del playbook que se ejecuta, sin importar cuál
# de los dos cambie. Como en AWX el Inventory lo administra AWX (no
# necesariamente inventory/hosts.ini de este repo), poner las variables
# del proyecto aquí garantiza que se carguen igual en local y en AWX. Ver
# README, sección 6, para el detalle de precedencia.
#
# Las excepciones puntuales por host se definen en playbooks/host_vars/.

# ---------------------------------------------------------------------------
# Control general de la ejecución
# ---------------------------------------------------------------------------

# Modo de ejecución. Se define normalmente como extra-var / Survey de AWX.
# Valores válidos: precheck | sp4_to_sp5 | sp5_to_sp6 | sp6_to_sp7 | full
#
# - precheck : salud y preparación del servidor. No modifica nada.
# - sp4_to_sp5 / sp5_to_sp6 / sp6_to_sp7 / full : ejecución real, con
#   modificación del servidor. Requieren confirm_production_upgrade: true.
upgrade_mode: precheck

# CRQ/RFC, Lote y Ambiente del Survey de AWX: son el único mecanismo de
# selección de hosts (un host entra al alcance solo si sus columnas
# CRQ/Lote/Ambiente del inventario coinciden EXACTAMENTE con estos 3
# valores -- ver playbooks/upgrade.yml). Ya no se usa "Limit" de AWX.
#
# Prefijo "upgrade_" deliberado, distinto de "crq"/"lote"/"ambiente" a
# secas: evita que un host herede silenciosamente el CRQ/Lote de un ciclo
# de PARCHADO anterior (esos nombres ya los expone el inventario dinámico
# para otro propósito). Vacíos aquí solo para que el archivo cargue sin
# valores; en una ejecución real los 3 son obligatorios.
upgrade_crq: ""
upgrade_lote: ""
upgrade_ambiente: ""

# Permite partir una etapa real en 2 pasos separados (ej. 2 nodos de un
# Workflow con un Approval Node entre ambos), en vez de todo en una corrida:
#
# - prepare : backup + deshabilitar preexistentes + repos ORIGEN +
#             updatestack + repos DESTINO agregados. Se detiene ahí --
#             nunca ejecuta dup -D/dup/reinicio.
# - apply   : exige que los repos DESTINO de un "prepare" previo ya estén
#             habilitados, luego dup -D -> dup -> reinicio -> validación.
# - both    : todo en una sola corrida (default).
#
# upgrade_mode: full siempre se comporta como "both" en cada uno de sus 2
# saltos encadenados, excepto combinado con upgrade_phase=prepare, donde
# no hace nada (ver run_stage.yml) -- así un mismo Workflow sirve para un
# salto individual o para full sin disparar un dup real por error.
upgrade_phase: "both"

# Procesamiento productivo por defecto: un host a la vez.
serial_batch_size: 1

# Candado de seguridad: ningún modo real modifica el sistema a menos que
# esto sea true. Se valida ANTES de tocar repositorios o paquetes.
#
# No existe "dry_run": el gate obligatorio "dup -D" (sp_migration/tasks/
# main.yml) cumple ese rol inmediatamente antes del "dup" real.
confirm_production_upgrade: false

# Un upgrade real de Service Pack SIEMPRE requiere reinicio: no existe una
# opción para omitirlo (ver playbooks/roles/sp_migration/tasks/main.yml).

# ---------------------------------------------------------------------------
# Foreman / Katello — información pendiente del ambiente
# ---------------------------------------------------------------------------
# Regla obligatoria: el upgrade usa EXCLUSIVAMENTE estos repositorios,
# tanto para el Service Pack de ORIGEN (updatestack) como para el de
# DESTINO (dup). Ningún repositorio preexistente del servidor participa
# en updatestack ni en dup. SUSEConnect nunca se usa para descubrir/
# habilitar repos. No inventar URLs ni nombres.

katello:
  base_url: "https://ansibleforeman.coldecom.com"

  # CA interna para validar TLS contra Foreman/Katello ("CAColdecom",
  # versionada en roles/repo_management/files/coldecom-ca.crt). Ruta en el
  # HOST ADMINISTRADO, no en el nodo de control. Zypper usa el almacén de
  # confianza del sistema operativo (no esta variable), así que PRECHECK
  # instala esta CA ahí automáticamente si falta
  # (roles/repo_management/tasks/ensure_ca_trusted.yml) -- idempotente.
  ca_certificate_path: /etc/pki/trust/anchors/coldecom-ca.crt

  # Repos Foreman para el Service Pack ORIGEN de la etapa SP4 -> SP5
  # (modo "sp4_to_sp5", hosts todavía en SP4). Solo para
  # "zypper patch --updatestack-only".

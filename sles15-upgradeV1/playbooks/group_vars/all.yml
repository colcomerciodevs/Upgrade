---
# playbooks/group_vars/all.yml
#
# Variables comunes a todos los hosts. Los valores marcados como CHANGE_ME
# son datos reales del ambiente que todavía no han sido provistos por el
# administrador. NO deben sustituirse con datos inventados.
#
# UBICACIÓN DELIBERADA: este archivo vive junto al playbook
# (playbooks/upgrade.yml), NO junto al inventario. Ansible carga
# group_vars/host_vars tanto desde el directorio del inventario en uso
# como desde el directorio del playbook que se ejecuta, sin importar cuál
# de los dos cambie. Como en AWX el Inventory lo administra AWX (no
# necesariamente inventory/hosts.ini de este repo), poner las variables
# del proyecto aquí garantiza que se carguen igual en local y en AWX. Ver
# README, sección 6, para el detalle de precedencia.
#
# Las excepciones puntuales por host se definen en playbooks/host_vars/.

# ---------------------------------------------------------------------------
# Control general de la ejecución
# ---------------------------------------------------------------------------

# Modo de ejecución. Se define normalmente como extra-var / Survey de AWX.
# Valores válidos: precheck | validate | sp5_to_sp6 | sp6_to_sp7 | full
#
# - precheck : salud y preparación del servidor. No modifica nada.
# - validate : preflight REAL contra Foreman (Zypper real, repos aislados
#              con --reposd-dir). No modifica /etc/zypp/repos.d ni instala
#              paquetes.
# - sp5_to_sp6 / sp6_to_sp7 / full : ejecución REAL, con modificación del
#              servidor. Requieren confirm_production_upgrade: true.
upgrade_mode: precheck

# Metadatos de control de cambios (CRQ/RFC, Lote, Ambiente), provistos por
# el Survey de AWX. Decisión explícita del usuario para este ambiente: estos
# 3 valores NO son solo trazabilidad — son el ÚNICO mecanismo de selección
# de hosts de todo el playbook (ver playbooks/upgrade.yml, plays iniciales
# "Validar que se declaró..."/"Seleccionar los hosts..."/"Verificar que
# hubo..."). Un host entra al alcance de la ejecución únicamente si sus
# columnas CRQ/Lote/Ambiente del inventario (ver más abajo) coinciden
# EXACTAMENTE con estos 3 valores; si ninguno coincide, el playbook falla
# explícito antes de tocar cualquier host. "Limit" de AWX ya NO se usa para
# seleccionar hosts en este proyecto.
#
# Se usa el prefijo "upgrade_" deliberadamente, DISTINTO de "crq"/"lote"/
# "ambiente" a secas: el inventario dinámico Excel/SharePoint de este
# proyecto (inventory/linux_excel_inventory.yml) ya expone esos mismos
# nombres como variables de host (columnas CRQ/Lote/Ambiente de la hoja de
# parchado). Si el Survey usara los mismos nombres, un host heredaría
# silenciosamente un CRQ/Lote de un ciclo de PARCHADO anterior, no el de
# este upgrade. Vacíos por defecto solo para que ansible-playbook/ansible-lint
# puedan cargar este archivo sin valores; en una ejecución real (local o AWX)
# los 3 son obligatorios (ver el assert correspondiente en playbooks/upgrade.yml).
upgrade_crq: ""
upgrade_lote: ""
upgrade_ambiente: ""

# Permite ejecutar una etapa real (sp4_to_sp5/sp5_to_sp6/sp6_to_sp7) en 2
# pasos separados (por ejemplo, como 2 nodos de un Workflow Job Template en
# AWX, con un Approval Node entre ambos), en vez de todo en una sola corrida:
#
# - prepare : backup + deshabilitar preexistentes + repos ORIGEN +
#             updatestack (real) + repos DESTINO agregados y verificados.
#             Se detiene ahí -- NO ejecuta dup -D, dup, ni reinicio. El
#             sistema SÍ queda modificado (requiere confirm_production_upgrade
#             igual que "both").
# - apply   : verifica (gate) que los repos DESTINO de una fase "prepare"
#             previa sigan exactamente habilitados: si no, falla explícito
#             pidiendo ejecutar primero "prepare". Luego dup -D -> dup real
#             -> reinicio -> validación -> limpieza.
# - both    : comportamiento de siempre, todo en una sola corrida (default,
#             compatibilidad total con un único Job Template sin Workflow).
#
# upgrade_mode: full SIEMPRE se comporta como "both" para cada uno de sus 2
# saltos encadenados (SP5->SP6 y SP6->SP7): no tiene un único momento de
# "preparar" válido para ambos a la vez. La ÚNICA excepción es
# upgrade_phase=prepare combinado con upgrade_mode=full: ahí esta etapa no
# hace nada (ver playbooks/tasks/run_stage.yml, _effective_upgrade_phase),
# para que un Workflow con un solo diseño sirva tanto para un salto
# individual como para full, sin que full dispare un dup real por error en
# el nodo que se supone que solo prepara.
upgrade_phase: "both"

# Procesamiento productivo por defecto: un host a la vez.
serial_batch_size: 1

# Candado de seguridad explícito: NINGÚN modo real (sp5_to_sp6, sp6_to_sp7,
# full) modifica el sistema a menos que este valor sea true. El assert que
# lo exige se ejecuta ANTES de tocar repositorios o paquetes. Debe activarse
# a propósito (por ejemplo desde un Survey de AWX), nunca por defecto.
#
# No existe una opción "dry_run" para los modos reales: para ensayar sin
# modificar el sistema, use upgrade_mode: validate. Un modo real siempre
# ejecuta internamente "dup -D" como gate obligatorio inmediatamente antes
# del "dup" real (ver playbooks/roles/sp_migration/tasks/main.yml); si ese gate
# falla, la etapa se detiene con FAILED sin aplicar ningún cambio.
confirm_production_upgrade: false

# Un upgrade real de Service Pack SIEMPRE requiere reinicio: no existe una
# opción para omitirlo (ver playbooks/roles/sp_migration/tasks/main.yml).

# ---------------------------------------------------------------------------
# Foreman / Katello — información pendiente del ambiente
# ---------------------------------------------------------------------------
# Regla obligatoria: el upgrade usa EXCLUSIVAMENTE estos repositorios,
# tanto para el Service Pack de ORIGEN (updatestack) como para el de
# DESTINO (dup). Ningún repositorio preexistente del servidor participa
# en updatestack ni en dup. SUSEConnect nunca se usa para descubrir/
# habilitar repos. No inventar URLs ni nombres.

katello:
  base_url: "https://ansibleforeman.coldecom.com"

  # CA interna requerida para validar TLS contra Foreman/Katello (CA real
  # "CAColdecom", provista por el administrador; archivo versionado en
  # playbooks/roles/repo_management/files/coldecom-ca.crt de este repositorio).
  #
  # IMPORTANTE: esta ruta es en el HOST ADMINISTRADO (SLES), no en el nodo
  # de control. Para el chequeo de PRECHECK (ansible.builtin.uri) alimenta
  # directamente ca_path. Para que Zypper mismo confíe en Foreman durante
  # VALIDATE/UPGRADE (Zypper no lee esta variable: usa el almacén de
  # confianza del sistema operativo), esta misma CA se instala
  # AUTOMÁTICAMENTE en este path mediante
  # playbooks/roles/repo_management/tasks/ensure_ca_trusted.yml — decisión explícita
  # del usuario para este ambiente (ver orden de fuentes de verdad en
  # CLAUDE.md): es la única escritura al sistema operativo que ocurre
  # durante upgrade_mode: validate, justificada porque sin ella la propia
  # prueba TLS de VALIDATE no tiene sentido. Operación idempotente (solo
  # agrega una CA de confianza si todavía no está presente; no reinicia
  # servicios). Se ejecuta automáticamente justo antes de que se agregue o
  # use cualquier repo Foreman real (add_temp_repos.yml y preflight.yml).
  ca_certificate_path: /etc/pki/trust/anchors/coldecom-ca.crt


# Prefijo obligatorio de los repositorios temporales creados por esta
# automatización (nunca se usa para nombrar repos permanentes).
temporary_repo_prefix: "ansible-sles-upgrade-"

# Reintentos ante el lock TRANSITORIO de PackageKit en cualquier comando de
# Zypper que modifica algo (addrepo, modifyrepo --disable, removerepo,
# refresh, dup -D, dup real) -- rc=7, ZYPPER_EXIT_ZYPP_LOCKED, confirmado
# contra el código fuente oficial de zypper
# (https://github.com/openSUSE/zypper/blob/master/src/main.h). Vive aquí
# (no como default de un rol) porque la usan dos roles distintos
# (repo_management y sp_migration) y "include_role" dinámico no expone los
# defaults de un rol a otro (confirmado con prueba aislada, 2026-10-06).
zypper_lock_retries: 5
zypper_lock_delay: 5

# Agentes de seguridad corporativos que, confirmado con evidencia real en
# laboratorio (sles15-sp5-sp7 / 10.181.8.36, 2026-10-06), toman
# intermitentemente el lock de libzypp vía PackageKit (D-Bus) durante sus
# escaneos de vulnerabilidades/parches -- cada escaneo activa un
# "packagekitd" nuevo (PID distinto cada vez), que puede ganarle el lock a
# Zypper incluso con los reintentos de zypper_lock_retries/_delay
# agotados. Se confirmó en el host (systemctl, ps, journalctl) que no hay
# timer/cron propio de este proyecto ni de parchado corporativo causando
# esto -- es exclusivamente la actividad rutinaria de estos 2 agentes.
#
# roles/repo_management/tasks/pause_security_agents.yml los detiene
# TEMPORALMENTE (nunca los deshabilita/desinstala) justo antes de
# modificar cualquier repositorio o paquete, y
# resume_security_agents.yml los reinicia al terminar -- ver
# playbooks/tasks/run_stage.yml para las condiciones exactas de cuándo se
# reinician (nunca entre los 2 saltos encadenados de upgrade_mode: full,
# solo al llegar a SP7 o si la etapa falló).
#
# Lista vacía es válida: un host sin estos agentes (o una decisión de no
# tocarlos) simplemente no activa este mecanismo.
zypper_lock_competing_services:
  - ds_agent
  - nessusagent

# Servicios que deben quedar PERMANENTEMENTE deshabilitados (systemctl
# disable, no solo detenidos) antes de CUALQUIER reinicio obligatorio de
# este proyecto. Lista vacía es válida -- es el valor por defecto desde
# el cambio de política de abajo.
#
# HISTORIAL: "postfix" estuvo en esta lista entre 2026-10-07 y 2026-10-09.
# Causa raíz confirmada con evidencia real en laboratorio:
# "postfix.service" podía colgar INDEFINIDAMENTE el arranque tras un
# upgrade de Service Pack -- `inet_interfaces = localhost` en
# /etc/postfix/main.cf intentaba resolver "::1" (IPv6) en un host sin
# IPv6 configurado; con el sistema ya arrancado y estable el mismo error
# fallaba rápido (<1s), pero durante el arranque, antes de que la red
# estuviera completamente lista, se quedaba colgado en vez de fallar
# rápido.
#
# CAMBIO DE POLÍTICA -- decisión explícita del usuario para este ambiente
# (2026-10-09): en vez de seguir deshabilitando postfix permanentemente,
# se corrige la causa raíz directamente en su configuración
# (`inet_protocols = ipv4`, roles/repo_management/tasks/
# harden_postfix_ipv6_root_cause.yml -- se ejecuta siempre, sin depender
# de esta lista) y se reinicia el servicio para que tome el fix de
# inmediato. Validado con evidencia real (2026-10-08/09, host
# sles15-sp5-sp7): con el fix puesto, postfix arranca en <1s sin
# problema. postfix ya NO se agrega aquí -- queda habilitado/activo como
# cualquier otro servicio del host, confiando en la corrección de su
# configuración en vez de en deshabilitarlo.
#
# A diferencia de zypper_lock_competing_services (que se PAUSAN
# temporalmente y se reinician después, porque el problema es
# transitorio): un servicio que SÍ se agregue aquí se deshabilita de
# forma PERMANENTE y nunca se vuelve a reiniciar automáticamente --
# resérvese para un problema que de verdad sea una configuración rota
# del host sin corrección conocida, no un parche temporal.
reboot_disable_services: []

# Conservar evidencia: habilitar almacenamiento persistente de journald
# (Storage=persistent + /var/log/journal) justo antes de ejecutar la
# migración real, para que los logs estructurados de la migración y del
# reinicio sobrevivan aunque el arranque siguiente tenga problemas. Ver
# roles/sp_migration/tasks/ensure_journald_persistent.yml. Idempotente;
# deshabilitar solo si el host ya gestiona esto por otro medio (ej. un
# forwarder centralizado que requiera journald en modo volátil).
journald_enable_persistent: true

# Validación post-reinicio: tras el reinicio obligatorio, cuánto tiempo
# (acotado) esperar a que systemd salga de "starting" antes de tomar la
# fotografía "después" (ver roles/precheck/tasks/wait_system_running.yml).
# 24 intentos x 5s = 120s máximo. Nunca bloquea ni falla la etapa: si se
# agota sin salir de "starting", se registra como informativo
# (systemd_settle_timed_out) y se continúa igual.
systemd_settle_retries: 24
systemd_settle_delay: 5

# Ante un fallo, por defecto NO se limpian los repositorios temporales
# ni el respaldo, para preservar información de diagnóstico.
cleanup_repositories_on_failure: false

# Lista puramente INFORMATIVA (opcional) para que el precheck marque como
# "no reconocido" cualquier repo configurado que no esté en esta lista.
# NO tiene ningún efecto sobre la ejecución del upgrade: absolutamente
# ningún repositorio preexistente (esté aquí listado o no) participa en
# updatestack ni en dup — todos los que estén habilitados se deshabilitan
# igual antes de migrar. Identificar por alias real de Zypper.
permanent_repos: []

# ---------------------------------------------------------------------------
# Servicios base del sistema
# ---------------------------------------------------------------------------
# PENDIENTE: no se asumen nombres. Completar con los servicios base reales
# del ambiente (ver CONTEXTO_PROYECTO.md) antes de producción. Una lista
# vacía se reporta como validación sin ítems (ni OK "falso" ni bloqueante).
critical_services: []

# ---------------------------------------------------------------------------
# Validación de GeoPOS
# ---------------------------------------------------------------------------
# Modelo 0..N por categoría. Cada categoría se habilita/deshabilita de
# forma independiente. Una categoría deshabilitada se reporta NOT_CHECKED.
#
# critical (por ítem): por defecto true. Si un ítem crítico está
# insalubre ANTES del upgrade y fail_precheck_if_unhealthy es true,
# el precheck bloquea el upgrade para ese host.
# Un ítem no crítico se marca explícitamente con critical: false.

geopos_validation:
  enabled: true

  # Política de precheck: bloquear el upgrade si un componente crítico
  # de GeoPOS no está saludable antes de iniciar. Puede sobrescribirse
  # en group_vars/host_vars puntuales cuando exista una excepción
  # operacional autorizada explícitamente.
  fail_precheck_if_unhealthy: true

  services:
    enabled: true
    items: []
    # Ejemplo estructural:
    # items:
    #   - name: CHANGE_ME_GEOPOS_SERVICE_1
    #     critical: true

  java_processes:
    enabled: true
    items: []
    # Ejemplo estructural. "match" debe identificar específicamente el
    # componente (nunca usar únicamente "java"):
    # items:
    #   - name: CHANGE_ME_COMPONENT_1
    #     match: CHANGE_ME_PROCESS_PATTERN_1
    #     critical: true

  tcp_ports:
    enabled: true
    items: []
    # items:
    #   - name: CHANGE_ME_COMPONENT_1
    #     port: CHANGE_ME_PORT_1
    #     critical: true

  health_checks:
    enabled: false
    items: []
    # items:
    #   - name: CHANGE_ME_COMPONENT
    #     url: CHANGE_ME_URL
    #     expected_status: 200
    #     critical: false

# ---------------------------------------------------------------------------
# Prechecks de espacio en disco
# ---------------------------------------------------------------------------
# Lista 0..N de filesystems a validar con un mínimo de espacio libre en MB.
# No se inventa ningún umbral: permanece vacía (NOT_CHECKED) hasta que el
# administrador aporte valores reales por filesystem.
precheck_disk_checks: []
# Ejemplo estructural:
# precheck_disk_checks:
#   - path: /
#     min_free_mb: CHANGE_ME
#   - path: /var
#     min_free_mb: CHANGE_ME

# Verificación adicional para raíz Btrfs con snapshots: SUSE recomienda
# como buena práctica disponer al menos del mismo espacio libre que el
# actualmente usado por el sistema (ver SLES 15 Upgrade Guide, sección
# "Checking disk space on Btrfs root file systems"). Esta comprobación
# se calcula dinámicamente (espacio libre >= espacio usado), no usa un
# porcentaje inventado. Puede desactivarse si no aplica al ambiente.
precheck_btrfs_double_space_check: true

# ---------------------------------------------------------------------------
# Reportes
# ---------------------------------------------------------------------------
report_enabled: true

# Directorio de trabajo donde se escriben los reportes DURANTE la
# ejecución (nodo de control / Execution Environment de AWX). Esto NO es
# almacenamiento persistente: el filesystem de un Execution Environment de
# AWX puede ser efímero y desecharse al terminar el Job, incluso para
# "localhost". Es solo la ubicación de trabajo mientras corre el playbook.
report_local_dir: "{{ playbook_dir }}/../reports"

# Destino persistente DEFINITIVO. Se copia aquí (ver playbooks/roles/reporting/tasks/
# main.yml) con delegate_to: localhost + remote_src: true — es decir, esta
# ruta se resuelve en el MISMO nodo de control/Execution Environment donde
# corre Ansible, NUNCA en el servidor SLES administrado.
#
# PENDIENTE DE CONFIRMAR EN EL AWX REAL (no se puede verificar desde el
# desarrollo de este proyecto):
#   1. Que /data/work/Salida_Upgrade exista y tenga permisos de escritura
#      para el usuario con el que corre el Job en el Execution Environment.
#   2. Que sea realmente persistente (un volumen/mount que sobrevive al
#      Job), no un directorio efímero dentro del propio contenedor del EE
#      — si el EE es un contenedor que se destruye al terminar el Job, esta
#      ruta debe estar montada desde fuera de él. Ver
#      ARQUITECTURA_Y_DISENO_TECNICO.html, sección 9.
# Sin "CHANGE_ME" en el valor, playbooks/roles/reporting ya intenta la copia; revisar
# el reporte HTML (bloque "Persistencia del reporte") para confirmar que la
# copia fue exitosa en la primera ejecución real.
report_destination: "/data/work/Salida_Upgrade"

# ---------------------------------------------------------------------------
# Sincronización de reportes hacia SharePoint (etapa 5 opcional del Workflow)
# ---------------------------------------------------------------------------
# playbooks/sync_sharepoint.yml sube hacia esta carpeta real de SharePoint
# (dato real dado por el administrador, no inventado) los reportes YA
# ESCRITOS en report_destination para el CRQ de la ejecución -- nunca
# report_local_dir, que es efímero y puede no sobrevivir entre nodos
# separados del Workflow (ver README, sección 11). Mismo sitio de
# SharePoint que usa el inventario dinámico (inventory/linux_excel_inventory.yml),
# pero una carpeta distinta.
#
# Requiere las MISMAS credenciales que el inventario dinámico
# (TENANT_ID/CLIENT_ID/CLIENT_SECRET, Credential "SharePoint Excel
# Inventory") adjuntas también a este Job Template -- ver docs/AWX_SETUP.html.
#
# PENDIENTE DE CONFIRMAR: que el App Registration de Azure AD usado para
# esas credenciales tenga permiso de ESCRITURA en SharePoint
# (Sites.ReadWrite.All), no solo lectura -- el inventario dinámico solo
# necesitaba leer. No se puede verificar desde el desarrollo de este
# proyecto; confirmar en la primera sincronización real.
sharepoint_sync:
  enabled: true
  site_hostname: "colcomerciocom.sharepoint.com"
  site_path: "/sites/AreaInfraestructura"
  folder_path: "General/Reportes_Automatizacion/Upgrade_ServicePack_SLES"

# Prefijo obligatorio de los repositorios temporales creados por esta
# automatización (nunca se usa para nombrar repos permanentes).
temporary_repo_prefix: "ansible-sles-upgrade-"

# Reintentos ante el lock TRANSITORIO de PackageKit (rc=7,
# ZYPPER_EXIT_ZYPP_LOCKED) en cualquier comando de Zypper que modifica
# algo. Vive aquí (no en un rol) porque lo usan repo_management y
# sp_migration, y "include_role" dinámico no comparte defaults entre roles.
zypper_lock_retries: 5
zypper_lock_delay: 5

# Agentes de seguridad corporativos que pueden tomar intermitentemente el
# lock de libzypp vía PackageKit durante sus escaneos de vulnerabilidades.
# roles/repo_management/tasks/pause_security_agents.yml los detiene
# TEMPORALMENTE (nunca los deshabilita/desinstala) antes de modificar
# cualquier repositorio o paquete; resume_security_agents.yml los
# reinicia al terminar (ver run_stage.yml para cuándo exactamente).
# Lista vacía es válida: un host sin estos agentes no activa el mecanismo.
zypper_lock_competing_services:
  - ds_agent
  - nessusagent

# Servicios que deben quedar PERMANENTEMENTE deshabilitados (systemctl
# disable, no solo detenidos) antes de cualquier reinicio obligatorio.
# Lista vacía es válida y es el default: "postfix" (causa real de cuelgue
# de arranque por IPv6) ya no se maneja aquí -- se corrige en su propia
# configuración (harden_postfix_ipv6_root_cause.yml, siempre se ejecuta)
# en vez de deshabilitarse. Resérvese esta lista para un problema sin
# corrección conocida; a diferencia de zypper_lock_competing_services
# (pausa temporal), lo que se agregue aquí no se reinicia después.
reboot_disable_services: []

# Arranque de depuración -- deshabilitado por defecto, actívese por
# host/corrida puntual cuando se necesite ver en la consola del
# hipervisor qué está haciendo el arranque paso a paso (diagnóstico para
# un cuelgue sin rastro en journald). Cuando está en true: GRUB_TERMINAL
# pasa a "console" (sin tema gráfico) y se agregan systemd.log_level=debug
# + systemd.show_status=1 + plymouth.enable=0 al cmdline, quitando
# splash/quiet -- vía un bloque al final de /etc/default/grub, sin tocar
# las líneas originales. En false (default), el bloque se retira si
# existía. Ver roles/repo_management/tasks/configure_grub_debug_boot.yml
# y roles/sp_migration/tasks/arm_grub_debug_boot.yml (reinicio de armado).
grub_debug_boot_enabled: false

# Habilita journald persistente (Storage=persistent) antes de migrar, para
# que los logs del reinicio sobrevivan aunque el arranque siguiente tenga
# problemas. Ver roles/sp_migration/tasks/ensure_journald_persistent.yml.
journald_enable_persistent: true

# Validación post-reinicio: tras el reinicio obligatorio, cuánto tiempo
# (acotado) esperar a que systemd salga de "starting" antes de tomar la
# fotografía "después" (ver roles/precheck/tasks/wait_system_running.yml).
# 24 intentos x 5s = 120s máximo. Nunca bloquea ni falla la etapa: si se
# agota sin salir de "starting", se registra como informativo
# (systemd_settle_timed_out) y se continúa igual.
systemd_settle_retries: 24
systemd_settle_delay: 5

# Ante un fallo, por defecto NO se limpian los repositorios temporales
# ni el respaldo, para preservar información de diagnóstico.
cleanup_repositories_on_failure: false

# Lista puramente INFORMATIVA (opcional) para que el precheck marque como
# "no reconocido" cualquier repo configurado que no esté en esta lista.
# NO tiene ningún efecto sobre la ejecución del upgrade: absolutamente
# ningún repositorio preexistente (esté aquí listado o no) participa en
# updatestack ni en dup — todos los que estén habilitados se deshabilitan
# igual antes de migrar. Identificar por alias real de Zypper.
permanent_repos: []

# ---------------------------------------------------------------------------
# Servicios base del sistema
# ---------------------------------------------------------------------------
# PENDIENTE: no se asumen nombres. Completar con los servicios base reales
# del ambiente (ver CONTEXTO_PROYECTO.md) antes de producción. Una lista
# vacía se reporta como validación sin ítems (ni OK "falso" ni bloqueante).
critical_services: []

# ---------------------------------------------------------------------------
# Validación de GeoPOS
# ---------------------------------------------------------------------------
# Modelo 0..N por categoría. Cada categoría se habilita/deshabilita de
# forma independiente. Una categoría deshabilitada se reporta NOT_CHECKED.
#
# critical (por ítem): por defecto true. Si un ítem crítico está
# insalubre ANTES del upgrade y fail_precheck_if_unhealthy es true,
# el precheck bloquea el upgrade para ese host.
# Un ítem no crítico se marca explícitamente con critical: false.

geopos_validation:
  enabled: true

  # Política de precheck: bloquear el upgrade si un componente crítico
  # de GeoPOS no está saludable antes de iniciar. Puede sobrescribirse
  # en group_vars/host_vars puntuales cuando exista una excepción
  # operacional autorizada explícitamente.
  fail_precheck_if_unhealthy: true

  services:
    enabled: true
    items: []
    # Ejemplo estructural:
    # items:
    #   - name: CHANGE_ME_GEOPOS_SERVICE_1
    #     critical: true

  java_processes:
    enabled: true
    items: []
    # Ejemplo estructural. "match" debe identificar específicamente el
    # componente (nunca usar únicamente "java"):
    # items:
    #   - name: CHANGE_ME_COMPONENT_1
    #     match: CHANGE_ME_PROCESS_PATTERN_1
    #     critical: true

  tcp_ports:
    enabled: true
    items: []
    # items:
    #   - name: CHANGE_ME_COMPONENT_1
    #     port: CHANGE_ME_PORT_1
    #     critical: true

  health_checks:
    enabled: false
    items: []
    # items:
    #   - name: CHANGE_ME_COMPONENT
    #     url: CHANGE_ME_URL
    #     expected_status: 200
    #     critical: false

# ---------------------------------------------------------------------------
# Prechecks de espacio en disco
# ---------------------------------------------------------------------------
# Lista 0..N de filesystems a validar con un mínimo de espacio libre en MB.
# No se inventa ningún umbral: permanece vacía (NOT_CHECKED) hasta que el
# administrador aporte valores reales por filesystem.
precheck_disk_checks: []
# Ejemplo estructural:
# precheck_disk_checks:
#   - path: /
#     min_free_mb: CHANGE_ME
#   - path: /var
#     min_free_mb: CHANGE_ME

# Verificación adicional para raíz Btrfs con snapshots: SUSE recomienda
# como buena práctica disponer al menos del mismo espacio libre que el
# actualmente usado por el sistema (ver SLES 15 Upgrade Guide, sección
# "Checking disk space on Btrfs root file systems"). Esta comprobación
# se calcula dinámicamente (espacio libre >= espacio usado), no usa un
# porcentaje inventado. Puede desactivarse si no aplica al ambiente.
precheck_btrfs_double_space_check: true

# ---------------------------------------------------------------------------
# Reportes
# ---------------------------------------------------------------------------
report_enabled: true

# Directorio de trabajo donde se escriben los reportes DURANTE la
# ejecución (nodo de control / Execution Environment de AWX). Esto NO es
# almacenamiento persistente: el filesystem de un Execution Environment de
# AWX puede ser efímero y desecharse al terminar el Job, incluso para
# "localhost". Es solo la ubicación de trabajo mientras corre el playbook.
report_local_dir: "{{ playbook_dir }}/../reports"

# Destino persistente definitivo (resuelto en el nodo de control/EE, nunca
# en el servidor SLES -- ver roles/reporting/tasks/main.yml).
#
# PENDIENTE DE CONFIRMAR EN AWX: que esta ruta exista con permisos de
# escritura y sea realmente persistente (no un directorio efímero del
# contenedor del EE). Revisar el bloque "Persistencia del reporte" del
# reporte HTML en la primera ejecución real.
report_destination: "/data/work/Salida_Upgrade"

# ---------------------------------------------------------------------------
# Sincronización de reportes hacia SharePoint (etapa 5 opcional del Workflow)
# ---------------------------------------------------------------------------
# sync_sharepoint.yml sube hacia esta carpeta de SharePoint los reportes
# ya escritos en report_destination (nunca report_local_dir, que es
# efímero). Mismo sitio de SharePoint que el inventario dinámico, carpeta
# distinta. Requiere las mismas credenciales (TENANT_ID/CLIENT_ID/
# CLIENT_SECRET) adjuntas también a este Job Template.
#
# PENDIENTE DE CONFIRMAR: que ese App Registration de Azure AD tenga
# permiso de ESCRITURA en SharePoint (Sites.ReadWrite.All), no solo
# lectura -- confirmar en la primera sincronización real.
sharepoint_sync:
  enabled: true
  site_hostname: "colcomerciocom.sharepoint.com"
  site_path: "/sites/AreaInfraestructura"
  folder_path: "General/Reportes_Automatizacion/Upgrade_ServicePack_SLES"

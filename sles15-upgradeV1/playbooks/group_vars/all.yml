    - name: SLE-Module-Basesystem15-SP4-Updates
      url: "https://ansibleforeman.coldecom.com/pulp/content/Default_Organization/Library/custom/Basesystem_Module_15_SP4_x86_64_id_2299_/2299_SLE-Module-Basesystem15-SP4-Updates_for_sle-15-x86_64/"
    - name: SLE-Module-Server-Applications15-SP4-Pool
      url: "https://ansibleforeman.coldecom.com/pulp/content/Default_Organization/Library/custom/Server_Applications_Module_15_SP4_x86_64_id_2307_/2307_SLE-Module-Server-Applications15-SP4-Pool_for_sle-15-x86_64/"
    - name: SLE-Module-Server-Applications15-SP4-Updates
      url: "https://ansibleforeman.coldecom.com/pulp/content/Default_Organization/Library/custom/Server_Applications_Module_15_SP4_x86_64_id_2307_/2307_SLE-Module-Server-Applications15-SP4-Updates_for_sle-15-x86_64/"
    - name: SLE-Module-Desktop-Applications15-SP4-Pool
      url: "https://ansibleforeman.coldecom.com/pulp/content/Default_Organization/Library/custom/Desktop_Applications_Module_15_SP4_x86_64_id_2303_/2303_SLE-Module-Desktop-Applications15-SP4-Pool_for_sle-15-x86_64/"
    - name: SLE-Module-Desktop-Applications15-SP4-Updates

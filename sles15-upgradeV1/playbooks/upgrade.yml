---
# playbooks/upgrade.yml
#
# Entrypoint único del proyecto. El modo de ejecución se controla con la
# variable `upgrade_mode` (ver playbooks/group_vars/all.yml):
#   precheck | validate | sp4_to_sp5 | sp5_to_sp6 | sp6_to_sp7 | full
#
# sp4_to_sp5 es una etapa INDEPENDIENTE (para hosts que todavía están en
# SP4): no se encadena dentro de "full", que sigue siendo exclusivamente
# SP5 -> SP6 -> SP7 (decisión explícita, ver ARQUITECTURA_Y_DISENO_TECNICO.html).
#
# El alcance de hosts de esta ejecución NO se controla con "Limit" de AWX:
# se controla con el MATCH EXACTO entre lo que el operador declara en el
# Survey (upgrade_crq/upgrade_lote/upgrade_ambiente) y los datos reales del
# host en el inventario dinámico (columnas CRQ/Lote/Ambiente del Excel, ver
# inventory/linux_excel_inventory.yml). Decisión explícita del usuario para
# este ambiente: cada ejecución -- incluso un precheck -- corresponde a un
# CRQ/RFC de control de cambios real, así que ese CRQ/Lote/Ambiente ES el
# criterio de selección de hosts (ver playbooks/select_target_hosts.yml,
# importado abajo -- también lo usa playbooks/precheck_only.yml, el Nodo 1
# del Workflow), no un dato aparte que haya que mantener sincronizado con
# un "Limit" manual.
#
# Si ningún host del inventario coincide con los 3 valores declarados, la
# ejecución falla explícitamente antes de tocar cualquier host en vez de
# continuar sin hosts o, peor, contra el host equivocado.

- name: Seleccionar los hosts de esta ejecución (match CRQ + Lote + Ambiente)
  ansible.builtin.import_playbook: select_target_hosts.yml

- name: Upgrade SLES 15 (SP4 -> SP5 -> SP6 -> SP7) para GeoPOS
  hosts: upgrade_target
  gather_facts: true
  serial: "{{ serial_batch_size | default(1) }}"
  vars:
    host_overall_status: "OK"
    geopos_validation_before:
      enabled: false
      overall_status: NOT_CHECKED
      critical_unhealthy: false
      categories: {}

  tasks:

    - name: Validar que upgrade_mode tiene un valor soportado
      ansible.builtin.assert:
        that:
          - upgrade_mode in ['precheck', 'validate', 'sp4_to_sp5', 'sp5_to_sp6', 'sp6_to_sp7', 'full']
        fail_msg: >-
          upgrade_mode debe ser uno de: precheck, validate, sp4_to_sp5, sp5_to_sp6,
          sp6_to_sp7, full (valor actual: {{ upgrade_mode | default('NO DEFINIDO') }})

    - name: Validar que upgrade_phase tiene un valor soportado
      ansible.builtin.assert:
        that:
          - (upgrade_phase | default('both')) in ['prepare', 'apply', 'both']
        fail_msg: >-
          upgrade_phase debe ser uno de: prepare, apply, both (valor actual:
          {{ upgrade_phase | default('NO DEFINIDO') }}). Ver
          playbooks/group_vars/all.yml para el significado de cada valor.

    # -----------------------------------------------------------------
    # MODO: precheck (independiente; de solo lectura salvo una excepción
    # documentada: puede instalar la CA interna si todavía no está
    # presente, ver roles/precheck/tasks/repos_reachability.yml)
    # -----------------------------------------------------------------
    - name: "Modo precheck"
      when: upgrade_mode == 'precheck'
      block:
        - name: Ejecutar precheck (etapa objetivo autodetectada)
          ansible.builtin.include_role:
            name: precheck

        - name: Ensamblar reporte de precheck
          ansible.builtin.set_fact:
            stage_report:
              hostname: "{{ inventory_hostname }}"
              fqdn: "{{ ansible_facts['fqdn'] | default(inventory_hostname) }}"
              crq: "{{ upgrade_crq | default('') }}"
              lote: "{{ upgrade_lote | default('') }}"
              ambiente: "{{ upgrade_ambiente | default('') }}"
              action: "precheck"
              stage: "precheck"
              started_at: "{{ system_state_snapshot_before.captured_at }}"
              finished_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
              sp_inicial: "{{ system_state_snapshot_before.current_sp_id }}"
              sp_objetivo: "{{ precheck_result.target_sp }}"
              sp_final: "{{ system_state_snapshot_before.current_sp_id }}"
              kernel_antes: "{{ system_state_snapshot_before.kernel }}"
              kernel_despues: "N/A (precheck no modifica el sistema)"
              precheck: "{{ precheck_result }}"
              preflight: {}
              repos: {}
              migration: {}
              reboot: {}
              critical_services_before: "{{ critical_services_before | default([]) }}"
              critical_services_after: []
              geopos_before: "{{ geopos_validation_before }}"
              geopos_after: {}
              status: "{{ precheck_result.overall_status }}"
              failure_stage: "{{ 'precheck' if precheck_result.overall_status == 'FAILED' else '' }}"

        - name: Generar reporte de precheck
          ansible.builtin.include_role:
            name: reporting

        - name: Propagar estado global del host (modo precheck)
          ansible.builtin.set_fact:
            host_overall_status: "{{ precheck_result.overall_status }}"

    # -----------------------------------------------------------------
    # MODO: validate — preflight REAL de la migración contra Foreman,
    # sin modificar /etc/zypp/repos.d ni aplicar ningún cambio.
    # Distinto de "precheck": aquí Zypper realmente contacta los repos
    # Foreman de la etapa objetivo (metadata, TLS/CA, GPG, solver) en un
    # directorio aislado con `--reposd-dir` (ver
    # playbooks/roles/sp_migration/tasks/preflight.yml).
    #
    # Si el preflight no pudo ejecutarse realmente (NOT_CHECKED) o falló
    # (FAILED), el resultado global de validate NUNCA es OK: debe quedar
    # visible que la validación no se completó.
    # -----------------------------------------------------------------
    - name: "Modo validate"
      when: upgrade_mode == 'validate'
      block:
        - name: Inicializar lista de checks básicos (reutiliza la lógica de precheck)
          ansible.builtin.set_fact:
            precheck_checks: []

        - name: Determinar Service Pack actual y etapa objetivo efectiva
          ansible.builtin.include_role:
            name: precheck
            tasks_from: sp_version.yml

        - name: Inventariar repositorios actuales
          ansible.builtin.include_role:
            name: precheck
            tasks_from: repo_inventory.yml

        - name: Verificar servicios críticos
          ansible.builtin.include_role:
            name: precheck
            tasks_from: critical_services.yml

        - name: Validar GeoPOS (estado actual)
          ansible.builtin.include_role:
            name: geopos_validation
          vars:
            geopos_validation_phase: after

        - name: Seleccionar repos Foreman/Katello de origen, destino y --releasever de la etapa objetivo
          ansible.builtin.set_fact:
            _validate_origin_sp: "{{ precheck_expected_current_sp | default('') }}"
            _validate_origin_repositories: "{{ katello[precheck_expected_current_sp ~ '_repositories'] if (precheck_expected_current_sp | default('')) | length > 0 else [] }}"
            _validate_target_repositories: "{{ katello[precheck_effective_target_sp ~ '_repositories'] if precheck_effective_target_sp in ['sp5', 'sp6', 'sp7'] else [] }}"
            _validate_target_releasever: "{{ '15-SP7' if precheck_effective_target_sp == 'sp7' else '' }}"

        - name: Registrar preflight NOT_CHECKED (sin etapa objetivo o sin repos Foreman de destino configurados)
          ansible.builtin.set_fact:
            sp_migration_preflight_result:
              status: NOT_CHECKED
              supported: null
              origin: {checked: false, status: NOT_CHECKED, output_summary: "no evaluado: falta el destino"}
              output_summary: >-
                No hay etapa objetivo determinada o no hay repositorios Foreman/Katello
                configurados todavía para "{{ precheck_effective_target_sp }}" (katello.{{ precheck_effective_target_sp }}_repositories).
          when: (_validate_target_repositories | length == 0)

        - name: "Ejecutar preflight real (origen: refresh; destino: refresh + dup -D)"
          ansible.builtin.include_role:
            name: sp_migration
            tasks_from: preflight.yml
          vars:
            sp_migration_target_sp: "{{ precheck_effective_target_sp }}"
            sp_migration_releasever: "{{ _validate_target_releasever }}"
            sp_migration_repositories: "{{ _validate_target_repositories }}"
            sp_migration_origin_sp: "{{ _validate_origin_sp }}"
            sp_migration_origin_repositories: "{{ _validate_origin_repositories }}"
          when: (_validate_target_repositories | length > 0)

        - name: "Calcular estado de la validación: recolectar evidencia por categoría (precedencia FAILED > NOT_CHECKED > WARNING > OK)"
          # IMPORTANTE: un precheck_checks en NOT_CHECKED (por ejemplo
          # "repositorios_no_esperados" cuando permanent_repos está vacío)
          # es informativo y NO degrada VALIDATE a NOT_CHECKED. Solo el
          # preflight real (sp_migration_preflight_result) determina el
          # NOT_CHECKED de VALIDATE.
          ansible.builtin.set_fact:
            _validate_failed_precheck_checks: "{{ precheck_checks | selectattr('status', 'equalto', 'FAILED') | map(attribute='name') | list }}"
            _validate_failed_critical_services: "{{ critical_services_status | selectattr('status', 'equalto', 'FAILED') | map(attribute='name') | list }}"
            _validate_warning_precheck_checks: "{{ precheck_checks | selectattr('status', 'equalto', 'WARNING') | map(attribute='name') | list }}"

        - name: Calcular estado final de la validación
          ansible.builtin.set_fact:
            _validate_status: >-
              {{
                'FAILED' if (
                  _validate_failed_precheck_checks | length > 0
                  or _validate_failed_critical_services | length > 0
                  or geopos_validation_result.critical_unhealthy
                  or sp_migration_preflight_result.status == 'FAILED'
                )
                else ('NOT_CHECKED' if sp_migration_preflight_result.status == 'NOT_CHECKED'
                else ('WARNING' if (
                  _validate_warning_precheck_checks | length > 0
                  or geopos_validation_result.overall_status == 'WARNING'
                )
                else 'OK'))
              }}

        - name: "Calcular el motivo exacto del resultado de VALIDATE (mismo orden de precedencia que el estado)"
          ansible.builtin.set_fact:
            _validate_status_reason: >-
              {{
                ('precheck FAILED: ' ~ (_validate_failed_precheck_checks | join(', '))) if _validate_failed_precheck_checks | length > 0
                else (('servicios_criticos FAILED: ' ~ (_validate_failed_critical_services | join(', '))) if _validate_failed_critical_services | length > 0
                else ('geopos_validation: critical_unhealthy=true' if geopos_validation_result.critical_unhealthy
                else (('preflight FAILED: ' ~ (sp_migration_preflight_result.output_summary | default(''))) if sp_migration_preflight_result.status == 'FAILED'
                else (('preflight NOT_CHECKED: ' ~ (sp_migration_preflight_result.output_summary | default(''))) if sp_migration_preflight_result.status == 'NOT_CHECKED'
                else (('precheck WARNING: ' ~ (_validate_warning_precheck_checks | join(', '))) if _validate_warning_precheck_checks | length > 0
                else ('geopos_validation: overall_status=WARNING' if geopos_validation_result.overall_status == 'WARNING'
                else ''))))))
              }}

        - name: Ensamblar reporte de validación
          ansible.builtin.set_fact:
            stage_report:
              hostname: "{{ inventory_hostname }}"
              fqdn: "{{ ansible_facts['fqdn'] | default(inventory_hostname) }}"
              crq: "{{ upgrade_crq | default('') }}"
              lote: "{{ upgrade_lote | default('') }}"
              ambiente: "{{ upgrade_ambiente | default('') }}"
              action: "validate"
              stage: "validate"
              started_at: "{{ system_state_snapshot_before.captured_at }}"
              finished_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
              sp_inicial: "{{ system_state_snapshot_before.current_sp_id }}"
              sp_objetivo: "{{ precheck_effective_target_sp }}"
              sp_final: "{{ system_state_snapshot_before.current_sp_id }}"
              kernel_antes: "{{ system_state_snapshot_before.kernel }}"
              kernel_despues: "{{ system_state_snapshot_before.kernel }}"
              precheck:
                checks: "{{ precheck_checks }}"
                repo_inventory: "{{ precheck_repo_inventory | default([]) }}"
              preflight: "{{ sp_migration_preflight_result }}"
              repos: {}
              migration: {}
              reboot: {}
              critical_services_before: "{{ critical_services_status }}"
              critical_services_after: "{{ critical_services_status }}"
              geopos_before: "{{ geopos_validation_before }}"
              geopos_after: "{{ geopos_validation_result }}"
              status: "{{ _validate_status }}"
              failure_stage: "{{ ('validate: ' ~ _validate_status_reason) if _validate_status != 'OK' else '' }}"

        - name: Generar reporte de validación
          ansible.builtin.include_role:
            name: reporting

        - name: Propagar estado global del host (modo validate)
          ansible.builtin.set_fact:
            host_overall_status: "{{ _validate_status }}"

    # -----------------------------------------------------------------
    # MODO: sp4_to_sp5 (independiente; para hosts todavía en SP4)
    # -----------------------------------------------------------------
    - name: "Modo sp4_to_sp5: ejecutar etapa SP4 -> SP5"
      when: upgrade_mode == 'sp4_to_sp5'
      ansible.builtin.include_tasks: tasks/run_stage.yml
      vars:
        stage_current_sp: "sp4"
        stage_target_sp: "sp5"
        stage_releasever: ""

    # -----------------------------------------------------------------
    # MODO: sp5_to_sp6 (independiente)
    # -----------------------------------------------------------------
    - name: "Modo sp5_to_sp6: ejecutar etapa SP5 -> SP6"
      when: upgrade_mode == 'sp5_to_sp6'
      ansible.builtin.include_tasks: tasks/run_stage.yml
      vars:
        stage_current_sp: "sp5"
        stage_target_sp: "sp6"
        stage_releasever: ""

    # -----------------------------------------------------------------
    # MODO: sp6_to_sp7 (independiente)
    # -----------------------------------------------------------------
    - name: "Modo sp6_to_sp7: ejecutar etapa SP6 -> SP7"
      when: upgrade_mode == 'sp6_to_sp7'
      ansible.builtin.include_tasks: tasks/run_stage.yml
      vars:
        stage_current_sp: "sp6"
        stage_target_sp: "sp7"
        stage_releasever: "15-SP7"

    # -----------------------------------------------------------------
    # MODO: full (SP5 -> SP6 -> SP7 encadenado, con gates)
    # -----------------------------------------------------------------
    - name: "Modo full: detectar Service Pack actual"
      when: upgrade_mode == 'full'
      block:
        - name: Capturar estado actual del sistema (modo full)
          ansible.builtin.include_role:
            name: precheck
            tasks_from: capture_state.yml
        - name: Conservar la fotografía "antes" explícitamente (modo full)
          ansible.builtin.set_fact:
            system_state_snapshot_before: "{{ system_state_snapshot }}"
        - name: Registrar Service Pack actual detectado (modo full)
          ansible.builtin.set_fact:
            _full_mode_current_sp: "{{ system_state_snapshot_before.current_sp_id }}"

    - name: "Modo full: ejecutar etapa SP5 -> SP6 (si el host no está ya en SP6/SP7)"
      when:
        - upgrade_mode == 'full'
        - _full_mode_current_sp not in ['sp6', 'sp7']
      ansible.builtin.include_tasks: tasks/run_stage.yml
      vars:
        stage_current_sp: "sp5"
        stage_target_sp: "sp6"
        stage_releasever: ""

    - name: "Modo full: ejecutar etapa SP6 -> SP7 (host ya en SP6, o SP6 recién aplicado, reiniciado y validado en esta misma ejecución)"
      when: >
        upgrade_mode == 'full' and (
          _full_mode_current_sp == 'sp6' or
          (stage_validated | default(false))
        )
      ansible.builtin.include_tasks: tasks/run_stage.yml
      vars:
        stage_current_sp: "sp6"
        stage_target_sp: "sp7"
        stage_releasever: "15-SP7"

    - name: "Modo full: informar que el host ya está en SP7 (nada que hacer)"
      when:
        - upgrade_mode == 'full'
        - _full_mode_current_sp == 'sp7'
      block:
        - name: Ensamblar reporte informativo (host ya en SP7)
          ansible.builtin.set_fact:
            stage_report:
              hostname: "{{ inventory_hostname }}"
              fqdn: "{{ ansible_facts['fqdn'] | default(inventory_hostname) }}"
              crq: "{{ upgrade_crq | default('') }}"
              lote: "{{ upgrade_lote | default('') }}"
              ambiente: "{{ upgrade_ambiente | default('') }}"
              action: "full"
              stage: "full"
              started_at: "{{ system_state_snapshot_before.captured_at }}"
              finished_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
              sp_inicial: "sp7"
              sp_objetivo: "sp7"
              sp_final: "sp7"
              kernel_antes: "{{ system_state_snapshot_before.kernel }}"
              kernel_despues: "{{ system_state_snapshot_before.kernel }}"
              precheck: {}
              preflight: {}
              repos: {}
              migration: {}
              reboot: {}
              critical_services_before: []
              critical_services_after: []
              geopos_before: "{{ geopos_validation_before }}"
              geopos_after: {}
              status: "OK"
              failure_stage: ""
        - name: Generar reporte informativo (host ya en SP7)
          ansible.builtin.include_role:
            name: reporting
        - name: Propagar estado global del host (host ya en SP7)
          ansible.builtin.set_fact:
            host_overall_status: "OK"

    # -----------------------------------------------------------------
    # Cierre: reflejar en el estado de Ansible/AWX si la etapa falló
    # -----------------------------------------------------------------
    - name: Marcar el host como fallido si el resultado final no fue satisfactorio o quedó incompleto
      ansible.builtin.fail:
        msg: >-
          El host {{ inventory_hostname }} terminó con estado {{ host_overall_status }}
          para upgrade_mode={{ upgrade_mode }}. Revise el reporte HTML/JSON en
          {{ _report_stage_dir | default(report_local_dir ~ '/' ~ inventory_hostname) }}/ para el detalle exacto.
      when: host_overall_status in ['FAILED', 'NOT_CHECKED']

# =============================================================================
# Resumen consolidado (independiente de si algún host falló en la fase
# anterior). Extraído a su propio archivo (playbooks/report_summary.yml)
# para que también pueda usarse como entrypoint propio -- por ejemplo, como
# la "Etapa 4: Reporting" de un Workflow Job Template en AWX (ver
# docs/AWX_SETUP.html) -- sin duplicar esta lógica en dos lugares.
# =============================================================================
- name: Generar resumen consolidado de la ejecución
  ansible.builtin.import_playbook: report_summary.yml

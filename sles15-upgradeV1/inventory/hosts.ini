; inventory/hosts.ini
;
; Este archivo es SOLO un ejemplo para pruebas locales de sintaxis
; (ansible-playbook --syntax-check) y para laboratorio.
;
; En AWX, el inventario real lo provee el objeto "Inventory" de AWX
; (estático o dinámico) y el alcance de ejecución se controla con
; "Limit", NO editando este archivo.
;
; IMPORTANTE: las variables comunes del proyecto NO viven aquí ni en
; inventory/group_vars — viven en playbooks/group_vars/all.yml (junto al
; playbook), precisamente para que se sigan cargando cuando AWX sustituya
; este inventario local por su propio Inventory. Este archivo debe limitarse
; a hosts/grupos y, como mucho, variables de conexión (ansible_host,
; ansible_user, etc.) para pruebas locales. Ver README, sección 6.
;
; No se han incluido hosts reales: CLAUDE.md prohíbe inventar
; información de infraestructura.

[geopos_servers]
; CHANGE_ME_HOSTNAME_1 ansible_host=CHANGE_ME_IP_1
; CHANGE_ME_HOSTNAME_2 ansible_host=CHANGE_ME_IP_2

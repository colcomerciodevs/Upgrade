# ansible.cfg — Proyecto de upgrade SLES 15 SP5 -> SP6 -> SP7
#
# En AWX, el Project/Job Template normalmente ignoran este archivo para
# credenciales e inventario (los define AWX), pero SÍ respetan roles_path
# y otras opciones no relacionadas con conexión/credenciales.
#
# Las variables comunes del proyecto viven en playbooks/group_vars/all.yml
# (no en inventory/group_vars): Ansible las carga automáticamente por estar
# junto al playbook, sin depender de qué Inventory (local o de AWX) se use
# para esta ejecución. Ver README, sección 6.

[defaults]
inventory      = inventory/hosts.ini
roles_path     = roles
retry_files_enabled = False
host_key_checking   = True
stdout_callback = default
forks = 5
# Plugin de inventario dinámico local (Excel/SharePoint), no es parte de
# ninguna Collection instalada. Requiere ubicarse en inventory_plugins/
# junto a este archivo (Ansible lo descubre automáticamente por ahí), pero
# se fija también explícitamente para evitar depender del cwd exacto con
# el que corra el Execution Environment de AWX.
inventory_plugins = ./inventory_plugins

[inventory]
# Los plugins de inventario requieren habilitación explícita (a diferencia
# de módulos/filtros). "excel_inventory" es el plugin local de
# inventory_plugins/excel_inventory.py; el resto son los plugins estándar
# de Ansible, para no romper otros usos (inventory/hosts.ini, etc.).
enable_plugins = excel_inventory, host_list, auto, yaml, ini

[privilege_escalation]
become = True
become_method = sudo

---
# roles/repo_management/tasks/disable_preexisting.yml
#
# Deshabilita ÚNICAMENTE los repositorios preexistentes que estaban
# HABILITADOS antes de esta ejecución (repos_enabled_before, calculado en
# backup.yml). Los que ya estaban deshabilitados no se tocan (no se hace
# ninguna llamada a Zypper por ellos). Ninguno se borra. Ninguno se
# reactiva automáticamente después: eso queda a cargo del proceso
# corporativo de parchado.
#
# El concepto "permanent_repos" NO participa aquí: absolutamente ningún
# repositorio preexistente puede quedar habilitado durante updatestack/dup
# de esta automatización (ver README, sección de repositorios).
#
# EVIDENCIA PARCIAL: si un repo falla a mitad del loop (por ejemplo, el
# tercero de cuatro), los que sí se deshabilitaron correctamente ANTES del
# fallo deben quedar registrados en repos_disabled_by_upgrade de todos
# modos. Por eso el loop nunca aborta a mitad de camino (failed_when:
# false) y el fallo se reporta de forma explícita DESPUÉS de consolidar la
# evidencia real, nunca se oculta.

- name: Deshabilitar los repositorios preexistentes que estaban habilitados
  ansible.builtin.command:
    cmd: "zypper --non-interactive modifyrepo --disable {{ item }}"
  loop: "{{ repos_enabled_before }}"
  become: true
  register: _disable_result
  changed_when: "'nothing to change' not in (_disable_result.stdout | default(''))"
  failed_when: false

- name: Registrar los repositorios EFECTIVAMENTE deshabilitados y los que fallaron (según rc real)
  ansible.builtin.set_fact:
    repos_disabled_by_upgrade: "{{ _disable_result.results | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
    _disable_failed_items: "{{ _disable_result.results | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"

- name: Fallar explícitamente si algún repositorio preexistente no pudo deshabilitarse
  ansible.builtin.fail:
    msg: >-
      No se pudieron deshabilitar los siguientes repositorios preexistentes:
      {{ _disable_failed_items | join(', ') }}. Los que sí se deshabilitaron
      correctamente antes del fallo quedaron registrados:
      {{ repos_disabled_by_upgrade | join(', ') or 'ninguno' }}.
  when: _disable_failed_items | length > 0
